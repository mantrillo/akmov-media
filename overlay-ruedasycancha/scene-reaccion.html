<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruedas & Cancha — Reacción / Transmisión (16:9)</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      width: 1920px;
      height: 1080px;
      background: transparent;
    }
  </style>
</head>
<body class="horizontal-canvas">
  <div class="sports-bg-layer"></div>
  <div class="sports-overlay-tint"></div>

  <div class="sports-frame-16x9"></div>

  <!-- Header Superior -->
  <div style="position: absolute; top: 35px; left: 60px; right: 60px; display: flex; justify-content: space-between; align-items: center; z-index: 20;">
    <div style="display: flex; align-items: center; gap: 16px;">
      <div id="streamer-logo" class="sports-hero-logo" style="max-height: 60px;"></div>
      <div class="sports-badge orange">
        <span class="sports-live-dot" style="background:var(--neon-secondary);"></span>
        <span>JUGADAS & ANÁLISIS</span>
      </div>
    </div>
    <div id="social-bar"></div>
  </div>

  <!-- Pantalla Principal de Video / Partido / Trucos Skate (Grande a la Izquierda) -->
  <div class="sports-cam-box" style="top: 120px; left: 60px; width: 1360px; height: 765px;">
    <div class="sports-cam-tag orange">
      <span class="sports-live-dot" style="background:var(--neon-secondary);"></span>
      <span>TRANSMISIÓN PRINCIPAL</span>
    </div>
  </div>

  <!-- Facecam del Comentarista (Derecha Superior) -->
  <div class="sports-cam-box" style="top: 120px; right: 60px; width: 420px; height: 315px;">
    <div class="sports-cam-tag">
      <span class="sports-live-dot"></span>
      <span id="cam-title">COMENTARISTA</span>
    </div>
  </div>

  <!-- Chat en Vivo (Derecha Inferior) -->
  <div class="sports-chat-box" style="top: 455px; right: 60px; width: 420px; height: 430px;">
    <div class="sports-chat-header">
      <span class="sports-live-dot"></span>
      <span>CHAT</span>
    </div>
    <div class="sports-chat-list" id="chat-list"></div>
  </div>

  <!-- Ticker Inferior -->
  <div class="sports-ticker-ribbon" style="top: auto; bottom: 45px; left: 60px; transform: none; width: 1800px; height: 40px;">
    <div class="sports-ticker-content" id="ticker-content" style="font-size: 14px;">
      <span>RUEDAS & CANCHA</span>
      <span>DEPORTES URBANOS</span>
      <span>MOTORES & RALLY</span>
      <span>VALLENAR • HUASCO • FREIRINA • ALTO DEL CARMEN</span>
      <span>RUEDAS & CANCHA</span>
      <span>DEPORTES URBANOS</span>
      <span>MOTORES & RALLY</span>
      <span>VALLENAR • HUASCO • FREIRINA • ALTO DEL CARMEN</span>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const logoEl = document.getElementById('streamer-logo');
    const camTitleEl = document.getElementById('cam-title');
    const tickerContentEl = document.getElementById('ticker-content');
    const socialBarEl = document.getElementById('social-bar');
    const chatListEl = document.getElementById('chat-list');

    window.ruedasEngine.onChatMessage((user, text) => {
      if (!chatListEl) return;
      const msg = document.createElement('div');
      msg.className = 'sports-chat-msg';
      msg.innerHTML = `<div class="user">${user}</div><div class="text">${text}</div>`;
      chatListEl.appendChild(msg);

      while (chatListEl.children.length > 5) {
        chatListEl.removeChild(chatListEl.firstChild);
      }
    });

    window.ruedasEngine.subscribe((cfg) => {
      window.ruedasEngine.renderHeroLogo(logoEl, { isHeader: true, maxHeight: 60, width: 280 });
      if (cfg.camTitles && cfg.camTitles.cam1) {
        camTitleEl.innerText = cfg.camTitles.cam1;
      }
      if (cfg.tickerText) {
        tickerContentEl.innerHTML = `<span>${cfg.tickerText}</span><span>${cfg.tickerText}</span>`;
      }
      window.ruedasEngine.renderSocialBar(socialBarEl);
    });
  </script>
</body>
</html>
