<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruedas & Cancha — Nos Vemos Pronto (16:9)</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      width: 1920px;
      height: 1080px;
      background: transparent;
    }
  </style>
</head>
<body class="horizontal-canvas">
  <div class="sports-bg-layer"></div>
  <div class="sports-overlay-tint"></div>

  <div class="sports-frame-16x9"></div>

  <!-- Hero Central de Despedida -->
  <div style="position: absolute; top: 48%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; text-align: center; z-index: 20; width: 100%;">
    <div id="streamer-logo" class="sports-hero-logo"></div>

    <div id="status-ending" style="font-family: var(--font-display); font-size: 48px; font-weight: 900; letter-spacing: 6px; color: var(--neon-secondary); margin-top: 18px; text-shadow: 0 0 25px rgba(255, 107, 0, 0.8);">
      ¡NOS VEMOS EN LA PRÓXIMA FECHA!
    </div>

    <div id="streamer-subtitle" style="font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: 5px; color: #fff; margin-top: 8px;">
      GRACIAS POR ACOMPAÑARNOS EN RUEDAS & CANCHA
    </div>
  </div>

  <!-- Barra de Chat Scroll Horizontal al Fondo -->
  <div class="chat-linear-bottom-bar" id="chat-linear-bar">
    <div class="chat-linear-badge">
      <span class="sports-live-dot"></span>
      <span>CHAT</span>
    </div>
    <div class="chat-linear-track" id="linear-chat-track"></div>
  </div>

  <!-- Redes Sociales Central Inferior -->
  <div style="position: absolute; bottom: 65px; left: 50%; transform: translateX(-50%); z-index: 20;" id="social-bar"></div>

  <script src="app.js"></script>
  <script>
    const logoEl = document.getElementById('streamer-logo');
    const statusEndingEl = document.getElementById('status-ending');
    const subtitleEl = document.getElementById('streamer-subtitle');
    const socialBarEl = document.getElementById('social-bar');
    const linearChatTrack = document.getElementById('linear-chat-track');

    window.ruedasEngine.onChatMessage((user, text) => {
      if (!linearChatTrack) return;
      const msgEl = document.createElement('div');
      msgEl.className = 'chat-linear-msg';
      msgEl.innerHTML = `
        <span class="chat-linear-user">${user}:</span>
        <span class="chat-linear-text">${text}</span>
      `;
      linearChatTrack.appendChild(msgEl);
      while (linearChatTrack.children.length > 12) {
        linearChatTrack.removeChild(linearChatTrack.firstChild);
      }
      linearChatTrack.scrollLeft = linearChatTrack.scrollWidth;
    });

    window.ruedasEngine.subscribe((cfg) => {
      window.ruedasEngine.renderHeroLogo(logoEl, { maxHeight: 380, width: 440 });
      if (cfg.statusEnding) statusEndingEl.innerText = cfg.statusEnding;
      if (cfg.subtitle) subtitleEl.innerText = `GRACIAS POR ACOMPAÑARNOS • ${cfg.subtitle}`;
      window.ruedasEngine.renderSocialBar(socialBarEl);
    });
  </script>
</body>
</html>
