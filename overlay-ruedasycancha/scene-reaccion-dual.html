<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruedas & Cancha — Transmisión Dual (16:9)</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      width: 1920px;
      height: 1080px;
      background: transparent;
    }
  </style>
</head>
<body class="horizontal-canvas">
  <div class="sports-bg-layer"></div>
  <div class="sports-overlay-tint"></div>

  <div class="sports-frame-16x9"></div>

  <!-- Header Superior -->
  <div style="position: absolute; top: 35px; left: 60px; right: 60px; display: flex; justify-content: space-between; align-items: center; z-index: 20;">
    <div style="display: flex; align-items: center; gap: 16px;">
      <div id="streamer-logo" class="sports-hero-logo" style="max-height: 60px;"></div>
      <div class="sports-badge">
        <span class="sports-live-dot"></span>
        <span>COMENTARISTAS DUAL</span>
      </div>
    </div>
    <div id="social-bar"></div>
  </div>

  <!-- Pantalla Principal / Partido / Evento -->
  <div class="sports-cam-box" style="top: 120px; left: 60px; width: 1360px; height: 765px;">
    <div class="sports-cam-tag orange">
      <span class="sports-live-dot" style="background:var(--neon-secondary);"></span>
      <span>TRANSMISIÓN</span>
    </div>
  </div>

  <!-- Facecam 1: Relator (Derecha Arriba) -->
  <div class="sports-cam-box" style="top: 120px; right: 60px; width: 420px; height: 236px;">
    <div class="sports-cam-tag">
      <span class="sports-live-dot"></span>
      <span id="host-name-label">RELATOR</span>
    </div>
  </div>

  <!-- Facecam 2: Comentarista (Derecha Medio) -->
  <div class="sports-cam-box orange" style="top: 375px; right: 60px; width: 420px; height: 236px;">
    <div class="sports-cam-tag orange">
      <span class="sports-live-dot" style="background:var(--neon-secondary);"></span>
      <span id="guest-name-label">COMENTARISTA</span>
    </div>
  </div>

  <!-- Barra de Chat Scroll Horizontal al Fondo -->
  <div class="chat-linear-bottom-bar" id="chat-linear-bar">
    <div class="chat-linear-badge">
      <span class="sports-live-dot"></span>
      <span>CHAT</span>
    </div>
    <div class="chat-linear-track" id="linear-chat-track"></div>
  </div>

  <script src="app.js"></script>
  <script>
    const logoEl = document.getElementById('streamer-logo');
    const hostLabelEl = document.getElementById('host-name-label');
    const guestLabelEl = document.getElementById('guest-name-label');
    const socialBarEl = document.getElementById('social-bar');
    const linearChatTrack = document.getElementById('linear-chat-track');

    window.ruedasEngine.onChatMessage((user, text) => {
      if (!linearChatTrack) return;
      const msgEl = document.createElement('div');
      msgEl.className = 'chat-linear-msg';
      msgEl.innerHTML = `
        <span class="chat-linear-user">${user}:</span>
        <span class="chat-linear-text">${text}</span>
      `;
      linearChatTrack.appendChild(msgEl);
      while (linearChatTrack.children.length > 12) {
        linearChatTrack.removeChild(linearChatTrack.firstChild);
      }
      linearChatTrack.scrollLeft = linearChatTrack.scrollWidth;
    });

    window.ruedasEngine.subscribe((cfg) => {
      window.ruedasEngine.renderHeroLogo(logoEl, { isHeader: true, maxHeight: 60, width: 280 });
      hostLabelEl.innerText = cfg.hostName || cfg.streamerName || 'RELATOR';
      guestLabelEl.innerText = cfg.guestName || 'COMENTARISTA';
      window.ruedasEngine.renderSocialBar(socialBarEl);
    });
  </script>
</body>
</html>
