<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruedas & Cancha — Entrevista & Dúo (16:9)</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      width: 1920px;
      height: 1080px;
      background: transparent;
    }
  </style>
</head>
<body class="horizontal-canvas">
  <div class="sports-bg-layer"></div>
  <div class="sports-overlay-tint"></div>

  <div class="sports-frame-16x9"></div>

  <!-- Header Superior -->
  <div style="position: absolute; top: 35px; left: 80px; right: 80px; display: flex; justify-content: space-between; align-items: center; z-index: 20;">
    <div style="display: flex; align-items: center; gap: 16px;">
      <div id="streamer-logo" class="sports-hero-logo" style="max-height: 60px;"></div>
      <div class="sports-badge">
        <span class="sports-live-dot"></span>
        <span>ENTREVISTA & PANEL</span>
      </div>
    </div>
    <div id="social-bar"></div>
  </div>

  <!-- Cámara 1: Conductor (Izquierda) -->
  <div class="sports-cam-box cam-duo-1">
    <div class="sports-cam-tag">
      <span class="sports-live-dot"></span>
      <span id="host-name-label">CONDUCTOR</span>
    </div>
  </div>

  <!-- Cámara 2: Invitado / Deportista (Derecha) -->
  <div class="sports-cam-box cam-duo-2">
    <div class="sports-cam-tag orange">
      <span class="sports-live-dot" style="background:var(--neon-secondary);"></span>
      <span id="guest-name-label">INVITADO</span>
    </div>
  </div>

  <!-- Chat Inferior Centrado -->
  <div class="sports-chat-box" style="bottom: 45px; left: 50%; transform: translateX(-50%); width: 840px; height: 210px;">
    <div class="sports-chat-header">
      <span class="sports-live-dot"></span>
      <span>CHAT DE LA COMUNIDAD</span>
    </div>
    <div class="sports-chat-list" id="chat-list"></div>
  </div>

  <script src="app.js"></script>
  <script>
    const logoEl = document.getElementById('streamer-logo');
    const hostLabelEl = document.getElementById('host-name-label');
    const guestLabelEl = document.getElementById('guest-name-label');
    const socialBarEl = document.getElementById('social-bar');
    const chatListEl = document.getElementById('chat-list');

    window.ruedasEngine.onChatMessage((user, text) => {
      if (!chatListEl) return;
      const msg = document.createElement('div');
      msg.className = 'sports-chat-msg';
      msg.innerHTML = `<div class="user">${user}</div><div class="text">${text}</div>`;
      chatListEl.appendChild(msg);

      while (chatListEl.children.length > 3) {
        chatListEl.removeChild(chatListEl.firstChild);
      }
    });

    window.ruedasEngine.subscribe((cfg) => {
      window.ruedasEngine.renderHeroLogo(logoEl, { isHeader: true, maxHeight: 60, width: 280 });
      hostLabelEl.innerText = cfg.hostName || cfg.streamerName || 'CONDUCTOR';
      guestLabelEl.innerText = cfg.guestName || 'INVITADO';
      window.ruedasEngine.renderSocialBar(socialBarEl);
    });
  </script>
</body>
</html>
