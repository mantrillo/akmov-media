<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruedas y Cancha — Ya Comenzamos (16:9)</title>
  <link rel="stylesheet" href="styles.css">
  <style> body { width: 1920px; height: 1080px; background: transparent; } </style>
</head>
<body class="horizontal-canvas">
  <div class="racing-bg-layer"></div>
  <div class="racing-frame-16x9"></div>

  <!-- Cinta Ticker Superior -->
  <div class="racing-ticker-ribbon">
    <div class="racing-ticker-content" id="ticker-content">
      <span>RUEDAS Y CANCHA</span>
      <span>PASIÓN TUERCA & DEPORTES</span>
      <span>RALLY & MOTORES</span>
      <span>VALLENAR • HUASCO • FREIRINA • ALTO DEL CARMEN</span>
      <span>RUEDAS Y CANCHA</span>
      <span>PASIÓN TUERCA & DEPORTES</span>
      <span>RALLY & MOTORES</span>
      <span>VALLENAR • HUASCO • FREIRINA • ALTO DEL CARMEN</span>
    </div>
  </div>

  <!-- Hero Central -->
  <div style="position: absolute; top: 48%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; text-align: center; z-index: 20; width: 100%;">
    <div id="streamer-logo" class="racing-hero-logo"></div>
    <div id="streamer-subtitle" style="font-family: var(--font-display); font-size: 24px; font-weight: 800; letter-spacing: 6px; color: #fff; margin-top: 14px;">
      DEPORTES • MOTORES • VALLE DEL HUASCO
    </div>
    <div class="racing-timer-box">
      <span class="racing-timer-label" id="status-text">LARGADA EN</span>
      <span class="racing-timer-digits" id="timer-digits">05:00</span>
    </div>
  </div>

  <div class="racing-chat-box" style="bottom: 50px; left: 60px; width: 440px; height: 260px;">
    <div class="racing-chat-header">
      <span class="racing-live-dot"></span>
      <span>CHAT EN VIVO</span>
    </div>
    <div class="racing-chat-list" id="chat-list"></div>
  </div>

  <div style="position: absolute; bottom: 50px; right: 60px; z-index: 20;" id="social-bar"></div>

  <script src="app.js"></script>
  <script>
    const logoEl = document.getElementById('streamer-logo');
    const subtitleEl = document.getElementById('streamer-subtitle');
    const statusTextEl = document.getElementById('status-text');
    const timerDigitsEl = document.getElementById('timer-digits');
    const tickerContentEl = document.getElementById('ticker-content');
    const socialBarEl = document.getElementById('social-bar');
    const chatListEl = document.getElementById('chat-list');

    window.ruedasEngine.onChatMessage((user, text) => {
      if (!chatListEl) return;
      const msg = document.createElement('div');
      msg.className = 'racing-chat-msg';
      msg.innerHTML = `<div class="user">${user}</div><div class="text">${text}</div>`;
      chatListEl.appendChild(msg);
      while (chatListEl.children.length > 4) chatListEl.removeChild(chatListEl.firstChild);
    });

    window.ruedasEngine.subscribe((cfg) => {
      window.ruedasEngine.renderHeroLogo(logoEl);
      if (cfg.subtitle) subtitleEl.innerText = cfg.subtitle;
      if (cfg.statusStarting) statusTextEl.innerText = cfg.statusStarting;
      if (cfg.tickerText) tickerContentEl.innerHTML = `<span>${cfg.tickerText}</span><span>${cfg.tickerText}</span>`;
      if (cfg.timer) timerDigitsEl.innerText = window.ruedasEngine.formatTimer(cfg.timer.remainingSeconds);
      window.ruedasEngine.renderSocialBar(socialBarEl);
    });
  </script>
</body>
</html>
