<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKMOV MEDIA — Overlay Now Playing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Oswald:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-black: #000000;
      --color-white: #ffffff;
      --color-neon: #00ff00;
      --color-neon-dim: rgba(0, 255, 0, 0.15);
      --color-neon-glow: rgba(0, 255, 0, 0.5);
      --color-bg: rgba(10, 10, 10, 0.85);
      --color-border: rgba(0, 255, 0, 0.3);
      
      --font-display: 'Oswald', sans-serif;
      --font-sans: 'Montserrat', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: transparent; /* Transparent for OBS */
      color: var(--color-white);
      font-family: var(--font-sans);
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      position: relative;
    }

    /* NOW PLAYING CONTAINER - POSICIONADA ABAJO A LA DERECHA */
    .now-playing-container {
      position: absolute;
      bottom: 50px;
      right: 50px;
      display: flex;
      align-items: center;
      background: var(--color-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid var(--color-border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 20px var(--color-neon-dim);
      padding: 16px 24px;
      border-radius: 4px;
      max-width: 650px;
      min-width: 400px;
      transform: translateY(150px);
      opacity: 0;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
      z-index: 100;
    }

    .now-playing-container.visible {
      transform: translateY(0);
      opacity: 1;
    }

    /* TURNTABLE / VINYL RECORD SYSTEM */
    .turntable-container {
      position: relative;
      width: 90px;
      height: 90px;
      margin-right: 24px;
      flex-shrink: 0;
    }

    .vinyl-record {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, #0d0d0d 32%, #222 34%, #121212 38%, #252525 40%, #121212 45%, #252525 47%, #121212 52%, #252525 54%, #121212 60%, #252525 63%, #121212 68%, #000 82%);
      box-shadow: 
        0 4px 15px rgba(0, 0, 0, 0.6), 
        inset 0 0 12px rgba(0, 0, 0, 0.95), 
        0 0 10px var(--color-neon-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(0, 255, 0, 0.25);
      transition: transform 0.3s ease;
    }

    .album-art {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 2px solid #000;
      z-index: 2;
    }

    .vinyl-center-hole {
      position: absolute;
      width: 6px;
      height: 6px;
      background-color: var(--color-black);
      border-radius: 50%;
      z-index: 3;
      border: 1.5px solid rgba(255, 255, 255, 0.35);
    }

    .needle-arm {
      position: absolute;
      top: -12px;
      right: -8px;
      width: 45px;
      height: 90px;
      transform-origin: 30px 15px;
      transform: rotate(-28deg);
      transition: transform 0.9s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 10;
      pointer-events: none;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
    }

    .now-playing-container.visible .needle-arm {
      transform: rotate(0deg);
    }

    .now-playing-container.visible .vinyl-record {
      animation: spin 3.5s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* INFO DE LA CANCIÓN */
    .song-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex-grow: 1;
      overflow: hidden;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--color-neon);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      background-color: var(--color-neon);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--color-neon);
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.4; }
    }

    .song-title-container,
    .song-artist-container {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }

    .song-title {
      display: inline-block;
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 700;
      line-height: 1.2;
      color: var(--color-white);
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
    }

    .song-artist {
      display: inline-block;
      font-size: 0.95rem;
      font-weight: 400;
      color: #aaaaaa;
      margin-top: 2px;
    }

    /* Marquee animation classes */
    .song-title.marquee-active {
      animation: marquee-title-scroll 10s linear infinite alternate;
    }

    .song-artist.marquee-active {
      animation: marquee-artist-scroll 10s linear infinite alternate;
    }

    @keyframes marquee-title-scroll {
      0%, 25% {
        transform: translateX(0);
      }
      75%, 100% {
        transform: translateX(var(--scroll-dist-title, -50%));
      }
    }

    @keyframes marquee-artist-scroll {
      0%, 25% {
        transform: translateX(0);
      }
      75%, 100% {
        transform: translateX(var(--scroll-dist-artist, -50%));
      }
    }

    /* SUBTLE MUSIC EQUALIZER INDICATOR */
    .eq-bar-container {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 20px;
      margin-left: 15px;
      flex-shrink: 0;
    }

    .eq-bar {
      width: 3px;
      background-color: var(--color-neon);
      border-radius: 1px;
      animation: bounce 1s ease-in-out infinite alternate;
      box-shadow: 0 0 5px var(--color-neon-dim);
    }

    .eq-bar:nth-child(1) { height: 60%; animation-delay: 0.1s; }
    .eq-bar:nth-child(2) { height: 100%; animation-delay: 0.4s; }
    .eq-bar:nth-child(3) { height: 40%; animation-delay: 0.2s; }
    .eq-bar:nth-child(4) { height: 80%; animation-delay: 0.5s; }

    @keyframes bounce {
      from { height: 20%; }
      to { height: 100%; }
    }

    /* WEATHER WIDGET - POSICIONADO ABAJO A LA IZQUIERDA */
    .weather-container {
      position: absolute;
      bottom: 50px;
      left: 50px;
      display: flex;
      flex-direction: column;
      background: var(--color-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid var(--color-border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 20px var(--color-neon-dim);
      padding: 12px 18px;
      border-radius: 4px;
      width: 320px;
      z-index: 100;
      font-family: var(--font-sans);
    }

    .weather-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 6px;
      margin-bottom: 10px;
    }

    .weather-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--color-white);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .weather-location {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--color-neon);
      text-transform: uppercase;
      transition: opacity 0.3s ease;
    }

    .weather-location.fade-out {
      opacity: 0;
    }

    .weather-days {
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .weather-days.fade-out {
      opacity: 0;
      transform: translateY(-5px);
    }

    .weather-day-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
    }

    .weather-day-name {
      font-weight: 700;
      width: 45px;
      color: var(--color-white);
      text-transform: uppercase;
    }

    .weather-condition {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-grow: 1;
      justify-content: flex-start;
      margin-left: 10px;
    }

    .weather-icon {
      font-size: 1.1rem;
    }

    .weather-desc {
      font-size: 0.75rem;
      color: #aaaaaa;
    }

    .weather-stats {
      display: flex;
      gap: 12px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      text-align: right;
    }

    .weather-temp {
      color: var(--color-white);
      font-weight: 700;
    }

    .weather-rain {
      color: #00ffff;
      display: flex;
      align-items: center;
      gap: 2px;
    }
  </style>
</head>
<body>

  <!-- WEATHER FORECAST WIDGET -->
  <div class="weather-container">
    <div class="weather-header">
      <span class="weather-title">Pronóstico</span>
      <span class="weather-location" id="weatherLocation">Cargando...</span>
    </div>
    <div class="weather-days" id="weatherDays">
      <!-- Days loaded dynamically -->
    </div>
  </div>

  <!-- NOW PLAYING WIDGET -->
  <div class="now-playing-container" id="nowPlayingWidget">
    <div class="turntable-container">
      <div class="vinyl-record">
        <img src="logo.png" alt="Carátula" class="album-art" id="albumArt">
        <div class="vinyl-center-hole"></div>
      </div>
      <svg class="needle-arm" viewBox="0 0 40 80">
        <!-- Pivot base -->
        <circle cx="30" cy="15" r="8" fill="#111" stroke="var(--color-neon)" stroke-width="1.5"/>
        <circle cx="30" cy="15" r="3" fill="var(--color-neon)"/>
        <!-- Arm/Shaft -->
        <path d="M 30 15 L 22 45 L 16 62" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/>
        <!-- Head/Cartridge -->
        <rect x="11" y="60" width="10" height="14" rx="1.5" fill="#222" stroke="var(--color-neon)" stroke-width="1" transform="rotate(-15, 16, 67)"/>
        <!-- Cartridge accent line -->
        <line x1="16" y1="62" x2="16" y2="72" stroke="var(--color-neon)" stroke-width="1"/>
      </svg>
    </div>
    
    <div class="song-info">
      <div class="badge-status">
        <span class="badge-dot"></span>
        <span id="statusLabel">AUTO DJ</span>
      </div>
      <div class="song-title-container">
        <div class="song-title" id="songTitle">Transmisión Online</div>
      </div>
      <div class="song-artist-container">
        <div class="song-artist" id="songArtist">Akmov Media</div>
      </div>
    </div>

    <div class="eq-bar-container">
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
    </div>
  </div>

  <script>
    const widget = document.getElementById('nowPlayingWidget');
    const albumArt = document.getElementById('albumArt');
    const songTitle = document.getElementById('songTitle');
    const songArtist = document.getElementById('songArtist');
    const statusLabel = document.getElementById('statusLabel');

    let currentTrackHash = '';
    const API_URL = '/now-playing';

    const baseApi = 'https://api.akmovmedia.com';

    // Función para calcular y aplicar el scroll horizontal si el texto no cabe
    function adjustMarquee(element, cssVar) {
      element.classList.remove('marquee-active');
      element.style.setProperty(cssVar, '0px');
      element.style.transform = '';
      
      // Esperar un frame de renderizado para medir el ancho real del texto nuevo
      requestAnimationFrame(() => {
        const container = element.parentElement;
        const scrollWidth = element.scrollWidth;
        const clientWidth = container.clientWidth;
        
        if (scrollWidth > clientWidth) {
          const scrollDist = clientWidth - scrollWidth - 20; // 20px extra al final
          element.style.setProperty(cssVar, `${scrollDist}px`);
          element.classList.add('marquee-active');
          
          // Velocidad del scroll (ej: 25px por segundo)
          const speed = 25;
          const duration = Math.max(6, Math.abs(scrollDist) / speed);
          element.style.animationDuration = `${duration}s`;
        }
      });
    }

    async function checkNowPlaying() {
      try {
        const response = await fetch(`${baseApi}${API_URL}`);
        if (!response.ok) throw new Error('API offline');
        
        const data = await response.json();
        
        // Crear un hash simple para ver si cambió la canción
        const trackHash = `${data.artist || ''}-${data.title || ''}-${data.cover || ''}`;
        
        if (trackHash !== currentTrackHash) {
          currentTrackHash = trackHash;
          
          if (!data.title || data.title === 'Transmisión Online') {
            // Si no hay canción, ocultar el widget suavemente
            widget.classList.remove('visible');
            songTitle.classList.remove('marquee-active');
            songArtist.classList.remove('marquee-active');
          } else {
            const isInitial = !widget.classList.contains('visible');
            
            if (isInitial) {
              // Carga inicial: actualizar directamente sin transición de fade-out
              songTitle.textContent = data.title;
              songArtist.textContent = data.artist || 'Akmov Media';
              albumArt.src = data.cover || 'logo.png';
              
              widget.classList.add('visible');
              adjustMarquee(songTitle, '--scroll-dist-title');
              adjustMarquee(songArtist, '--scroll-dist-artist');
            } else {
              // Transición suave: ocultar, cambiar contenido y volver a mostrar
              widget.classList.remove('visible');
              songTitle.classList.remove('marquee-active');
              songArtist.classList.remove('marquee-active');
              
              setTimeout(() => {
                songTitle.textContent = data.title;
                songArtist.textContent = data.artist || 'Akmov Media';
                albumArt.src = data.cover || 'logo.png';
                
                widget.classList.add('visible');
                adjustMarquee(songTitle, '--scroll-dist-title');
                adjustMarquee(songArtist, '--scroll-dist-artist');
              }, 600);
            }
          }
        }
      } catch (error) {
        console.warn('Error fetching now-playing:', error);
      }
    }

    // Chequear cada 3 segundos
    setInterval(checkNowPlaying, 3000);
    
    // Ejecución inicial rápida
    checkNowPlaying();

    // --- CÓDIGO DEL CLIMA (VALLE DEL HUASCO SLIDE - 3 DÍAS CON OPEN-METEO) ---
    const huascoLocations = [
      { name: 'Vallenar', lat: -28.5750, lon: -70.7583 },
      { name: 'Huasco', lat: -28.4683, lon: -71.2197 },
      { name: 'Freirina', lat: -28.5083, lon: -71.0778 },
      { name: 'Alto del Carmen', lat: -28.7583, lon: -70.4861 }
    ];

    let weatherCache = {};
    let currentLocationIndex = 0;

    function getWeatherDescription(code) {
      if (code === 0) return { label: 'Despejado', icon: '☀️' };
      if ([1, 2, 3].includes(code)) return { label: 'P. Nublado', icon: '⛅' };
      if ([45, 48].includes(code)) return { label: 'Niebla', icon: '🌫️' };
      if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return { label: 'Lluvia', icon: '🌧️' };
      if ([71, 73, 75].includes(code)) return { label: 'Nieve', icon: '❄️' };
      if ([95, 96, 99].includes(code)) return { label: 'Tormenta', icon: '⛈️' };
      return { label: 'Despejado', icon: '☀️' };
    }

    async function fetchAllLocationsWeather() {
      for (const loc of huascoLocations) {
        try {
          const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,weathercode&timezone=auto`);
          if (res.ok) {
            const data = await res.json();
            weatherCache[loc.name] = data.daily;
          }
        } catch (err) {
          console.warn(`Error al obtener el clima de ${loc.name}:`, err);
        }
      }
    }

    function renderCurrentLocationWeather() {
      const loc = huascoLocations[currentLocationIndex];
      const daily = weatherCache[loc.name];
      const daysContainer = document.getElementById('weatherDays');
      const locationElem = document.getElementById('weatherLocation');

      if (!daily) {
        locationElem.textContent = loc.name;
        daysContainer.innerHTML = '<div style="font-size:0.8rem;color:#aaa;padding:10px 0;">Cargando...</div>';
        return;
      }

      // Transición suave de salida
      daysContainer.classList.add('fade-out');
      locationElem.classList.add('fade-out');

      setTimeout(() => {
        locationElem.textContent = loc.name;
        daysContainer.innerHTML = '';

        const weekdayNames = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
        
        for (let i = 0; i < 3; i++) {
          const date = new Date(daily.time[i] + 'T00:00:00');
          let dayName = '';
          if (i === 0) dayName = 'Hoy';
          else if (i === 1) dayName = 'Mañ';
          else dayName = weekdayNames[date.getDay()];

          const maxTemp = Math.round(daily.temperature_2m_max[i]);
          const minTemp = Math.round(daily.temperature_2m_min[i]);
          const rainProb = daily.precipitation_probability_max[i] || 0;
          const rainSum = daily.precipitation_sum[i] || 0;
          const weatherCode = daily.weathercode[i];
          const condition = getWeatherDescription(weatherCode);

          const dayRow = document.createElement('div');
          dayRow.className = 'weather-day-row';
          dayRow.innerHTML = `
            <span class="weather-day-name">${dayName}</span>
            <div class="weather-condition">
              <span class="weather-icon">${condition.icon}</span>
              <span class="weather-desc">${condition.label}</span>
            </div>
            <div class="weather-stats">
              <span class="weather-temp">${minTemp}°/${maxTemp}°</span>
              <span class="weather-rain">💧 ${rainProb}% (${rainSum.toFixed(1)}mm)</span>
            </div>
          `;
          daysContainer.appendChild(dayRow);
        }

        // Transición de entrada
        daysContainer.classList.remove('fade-out');
        locationElem.classList.remove('fade-out');
      }, 300);
    }

    async function initWeatherSlide() {
      await fetchAllLocationsWeather();
      renderCurrentLocationWeather();

      // Cambiar de comuna cada 8 segundos
      setInterval(() => {
        currentLocationIndex = (currentLocationIndex + 1) % huascoLocations.length;
        renderCurrentLocationWeather();
      }, 8000);

      // Actualizar datos de Open-Meteo cada 30 minutos
      setInterval(fetchAllLocationsWeather, 30 * 60 * 1000);
    }

    initWeatherSlide();
  </script>
</body>
</html>
