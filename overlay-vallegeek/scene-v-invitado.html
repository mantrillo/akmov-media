<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valle Geek — Vertical: Dúo / Invitado (9:16)</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      width: 1080px;
      height: 1920px;
      background: transparent;
    }
  </style>
</head>
<body class="vertical-canvas">
  <div class="vallegeek-bg-layer"></div>
  <div class="vallegeek-overlay-tint"></div>
  <canvas id="bg-canvas" class="overlay-canvas-bg"></canvas>

  <div class="v-geek-frame"></div>

  <!-- Header Superior -->
  <div class="v-geek-header">
    <div class="geek-badge">
      <span class="geek-live-dot"></span>
      <span>ENTREVISTA & DÚO</span>
    </div>
  </div>

  <!-- Cámara 1: Host (Arriba) -->
  <div class="v-geek-cam-box duo-host">
    <div class="geek-cam-tag">
      <span class="geek-live-dot"></span>
      <span id="host-name-label">ANFITRIÓN</span>
    </div>
  </div>

  <!-- Cámara 2: Invitado (Abajo) -->
  <div class="v-geek-cam-box duo-guest">
    <div class="geek-cam-tag orange">
      <span class="geek-live-dot" style="background:var(--neon-secondary);"></span>
      <span id="guest-name-label">INVITADO</span>
    </div>
  </div>

  <!-- Chat Flotante Inferior -->
  <div class="v-geek-chat-container" style="bottom: 95px; height: 230px;">
    <div class="geek-chat-header">
      <span class="geek-live-dot"></span>
      <span>CHAT</span>
    </div>
    <div class="geek-chat-list" id="chat-list"></div>
  </div>

  <!-- Barra de Redes Sociales Inferior -->
  <div class="v-geek-social-footer" id="social-bar"></div>

  <script src="app.js"></script>
  <script>
    window.valleGeekApp.setupStarParticles('bg-canvas');

    const hostLabelEl = document.getElementById('host-name-label');
    const guestLabelEl = document.getElementById('guest-name-label');
    const socialBarEl = document.getElementById('social-bar');
    const chatListEl = document.getElementById('chat-list');

    window.valleGeekApp.onChatMessage((user, text) => {
      if (!chatListEl) return;
      const msg = document.createElement('div');
      msg.className = 'geek-chat-msg';
      msg.innerHTML = `<div class="user">${user}</div><div class="text">${text}</div>`;
      chatListEl.appendChild(msg);

      while (chatListEl.children.length > 3) {
        chatListEl.removeChild(chatListEl.firstChild);
      }
    });

    window.valleGeekApp.subscribe((cfg) => {
      hostLabelEl.innerText = cfg.hostName || cfg.streamerName || 'ANFITRIÓN';
      guestLabelEl.innerText = cfg.guestName || 'INVITADO';
      window.valleGeekApp.renderSocialBar(socialBarEl);
    });
  </script>
</body>
</html>
