<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valle Geek — Vertical: Cámara y Chat (9:16)</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      width: 1080px;
      height: 1920px;
      background: transparent;
    }
  </style>
</head>
<body class="vertical-canvas">
  <div class="vallegeek-bg-layer"></div>
  <div class="vallegeek-overlay-tint"></div>
  <canvas id="bg-canvas" class="overlay-canvas-bg"></canvas>

  <div class="v-geek-frame"></div>

  <!-- Header Superior -->
  <div class="v-geek-header">
    <div class="geek-badge">
      <span class="geek-live-dot"></span>
      <span>EN VIVO</span>
    </div>
    <div id="streamer-logo" class="vallegeek-hero-logo" style="margin-top: 10px; max-height: 80px;"></div>
  </div>

  <!-- Cámara Principal Vertical (Facecam Grande) -->
  <div class="v-geek-cam-box center-large">
    <div class="geek-cam-tag">
      <span class="geek-live-dot"></span>
      <span id="cam-title">CAM PRINCIPAL</span>
    </div>
  </div>

  <!-- Chat Flotante Inferior -->
  <div class="v-geek-chat-container">
    <div class="geek-chat-header">
      <span class="geek-live-dot"></span>
      <span>CHAT EN VIVO</span>
    </div>
    <div class="geek-chat-list" id="chat-list"></div>
  </div>

  <!-- Barra de Redes Sociales Inferior -->
  <div class="v-geek-social-footer" id="social-bar"></div>

  <script src="app.js"></script>
  <script>
    window.valleGeekApp.setupStarParticles('bg-canvas');

    const logoEl = document.getElementById('streamer-logo');
    const camTitleEl = document.getElementById('cam-title');
    const socialBarEl = document.getElementById('social-bar');
    const chatListEl = document.getElementById('chat-list');

    window.valleGeekApp.onChatMessage((user, text) => {
      if (!chatListEl) return;
      const msg = document.createElement('div');
      msg.className = 'geek-chat-msg';
      msg.innerHTML = `<div class="user">${user}</div><div class="text">${text}</div>`;
      chatListEl.appendChild(msg);

      while (chatListEl.children.length > 5) {
        chatListEl.removeChild(chatListEl.firstChild);
      }
    });

    window.valleGeekApp.subscribe((cfg) => {
      window.valleGeekApp.renderHeroLogo(logoEl, { isHeader: true, maxHeight: 75, width: 340 });
      if (cfg.camTitles && cfg.camTitles.cam1) {
        camTitleEl.innerText = cfg.camTitles.cam1;
      }
      window.valleGeekApp.renderSocialBar(socialBarEl);
    });
  </script>
</body>
</html>
