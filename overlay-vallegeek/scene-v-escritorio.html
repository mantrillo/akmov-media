<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valle Geek — Vertical: Escritorio (9:16)</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      width: 1080px;
      height: 1920px;
      background: transparent;
    }
  </style>
</head>
<body class="vertical-canvas">
  <div class="v-geek-frame"></div>

  <!-- Header Superior Discreto -->
  <div class="v-geek-header" style="top: 40px;">
    <div class="geek-badge">
      <span class="geek-live-dot"></span>
      <span>PANTALLA EN VIVO</span>
    </div>
    <div id="streamer-logo" class="vallegeek-hero-logo" style="margin-top: 8px; max-height: 65px;"></div>
  </div>

  <script src="app.js"></script>
  <script>
    const logoEl = document.getElementById('streamer-logo');
    window.valleGeekApp.subscribe((cfg) => {
      window.valleGeekApp.renderHeroLogo(logoEl, { isHeader: true, maxHeight: 60, width: 280 });
    });
  </script>
</body>
</html>
