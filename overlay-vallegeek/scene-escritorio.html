<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valle Geek — Escritorio Completo (16:9)</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      width: 1920px;
      height: 1080px;
      background: transparent;
    }
  </style>
</head>
<body class="horizontal-canvas">
  <!-- Marco Cyberpunk Limpio para Captura Completa de Juego o Escritorio -->
  <div class="geek-frame-16x9"></div>

  <!-- Badge Superior Discreto -->
  <div style="position: absolute; top: 35px; right: 50px; z-index: 20;">
    <div class="geek-badge">
      <span class="geek-live-dot"></span>
      <span>VALLE GEEK</span>
    </div>
  </div>

  <!-- Barra de Chat Scroll Horizontal al Fondo -->
  <div class="chat-linear-bottom-bar" id="chat-linear-bar">
    <div class="chat-linear-badge">
      <span class="geek-live-dot"></span>
      <span>CHAT</span>
    </div>
    <div class="chat-linear-track" id="linear-chat-track"></div>
  </div>

  <script src="app.js"></script>
  <script>
    const linearChatTrack = document.getElementById('linear-chat-track');
    window.valleGeekApp.onChatMessage((user, text) => {
      if (!linearChatTrack) return;
      const msgEl = document.createElement('div');
      msgEl.className = 'chat-linear-msg';
      msgEl.innerHTML = `
        <span class="chat-linear-user">${user}:</span>
        <span class="chat-linear-text">${text}</span>
      `;
      linearChatTrack.appendChild(msgEl);
      while (linearChatTrack.children.length > 12) {
        linearChatTrack.removeChild(linearChatTrack.firstChild);
      }
      linearChatTrack.scrollLeft = linearChatTrack.scrollWidth;
    });
  </script>
</body>
</html>
