<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valle Geek — Cámara 4 (Rótulo)</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { width: 1920px; height: 1080px; background: transparent; }
  </style>
</head>
<body class="horizontal-canvas">
  <div class="geek-cam-tag orange" style="top: 40px; left: 40px; font-size: 16px; padding: 8px 20px;">
    <span class="geek-live-dot" style="background:var(--neon-secondary);"></span>
    <span id="cam-label">CAM 4 - AMBIENTE</span>
  </div>
  <script src="app.js"></script>
  <script>
    window.valleGeekApp.subscribe((cfg) => {
      if (cfg.camTitles && cfg.camTitles.cam4) {
        document.getElementById('cam-label').innerText = cfg.camTitles.cam4;
      }
    });
  </script>
</body>
</html>
