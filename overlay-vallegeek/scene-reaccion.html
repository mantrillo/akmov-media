<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valle Geek — Reacción / Gameplay (16:9)</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      width: 1920px;
      height: 1080px;
      background: transparent;
    }
  </style>
</head>
<body class="horizontal-canvas">
  <div class="vallegeek-bg-layer"></div>
  <div class="vallegeek-overlay-tint"></div>
  <canvas id="bg-canvas" class="overlay-canvas-bg"></canvas>

  <div class="geek-frame-16x9"></div>

  <!-- Header Superior -->
  <div style="position: absolute; top: 35px; left: 60px; right: 60px; display: flex; justify-content: space-between; align-items: center; z-index: 20;">
    <div style="display: flex; align-items: center; gap: 16px;">
      <div id="streamer-logo" class="vallegeek-hero-logo" style="max-height: 60px;"></div>
      <div class="geek-badge orange">
        <span class="geek-live-dot" style="background:var(--neon-secondary); box-shadow: 0 0 10px var(--neon-secondary);"></span>
        <span>GAMEPLAY / REVIEW</span>
      </div>
    </div>
    <div id="social-bar"></div>
  </div>

  <!-- Marco de Pantalla / Video / Juego Principal (16:9) -->
  <div class="geek-cam-box" style="top: 120px; left: 60px; width: 1360px; height: 765px;">
    <div class="geek-cam-tag">
      <span class="geek-live-dot"></span>
      <span>GAMEPLAY & REACCIÓN</span>
    </div>
  </div>

  <!-- Facecam Lateral Derecha -->
  <div class="geek-cam-box" style="top: 120px; right: 60px; width: 400px; height: 300px;">
    <div class="geek-cam-tag orange">
      <span class="geek-live-dot" style="background:var(--neon-secondary);"></span>
      <span id="cam-title">STREAMER</span>
    </div>
  </div>

  <!-- Chat Lateral Derecho (Debajo de la Facecam) -->
  <div class="geek-chat-box" style="top: 440px; right: 60px; width: 400px; height: 445px;">
    <div class="geek-chat-header">
      <span class="geek-live-dot"></span>
      <span>CHAT</span>
    </div>
    <div class="geek-chat-list" id="chat-list"></div>
  </div>

  <!-- Ticker Inferior -->
  <div style="position: absolute; bottom: 40px; left: 60px; width: 1360px; height: 44px; background: rgba(7,8,20,0.9); border: 1.5px solid var(--border-neon); border-radius: 6px; overflow: hidden; display: flex; align-items: center; z-index: 20;">
    <div class="geek-ticker-content" id="ticker-content" style="font-size: 14px;">
      <span>VALLE GEEK</span>
      <span>CULTURA POP</span>
      <span>GAMING</span>
      <span>VALLENAR • HUASCO • FREIRINA • ALTO DEL CARMEN</span>
      <span>VALLE GEEK</span>
      <span>CULTURA POP</span>
      <span>GAMING</span>
      <span>VALLENAR • HUASCO • FREIRINA • ALTO DEL CARMEN</span>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    window.valleGeekApp.setupStarParticles('bg-canvas');

    const logoEl = document.getElementById('streamer-logo');
    const camTitleEl = document.getElementById('cam-title');
    const tickerContentEl = document.getElementById('ticker-content');
    const socialBarEl = document.getElementById('social-bar');
    const chatListEl = document.getElementById('chat-list');

    window.valleGeekApp.onChatMessage((user, text) => {
      if (!chatListEl) return;
      const msg = document.createElement('div');
      msg.className = 'geek-chat-msg';
      msg.innerHTML = `<div class="user">${user}</div><div class="text">${text}</div>`;
      chatListEl.appendChild(msg);

      while (chatListEl.children.length > 5) {
        chatListEl.removeChild(chatListEl.firstChild);
      }
    });

    window.valleGeekApp.subscribe((cfg) => {
      window.valleGeekApp.renderHeroLogo(logoEl);
      if (cfg.camTitles && cfg.camTitles.cam1) {
        camTitleEl.innerText = cfg.camTitles.cam1;
      }
      if (cfg.tickerText) {
        tickerContentEl.innerHTML = `<span>${cfg.tickerText}</span><span>${cfg.tickerText}</span>`;
      }
      window.valleGeekApp.renderSocialBar(socialBarEl);
    });
  </script>
</body>
</html>
