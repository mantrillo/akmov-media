<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valle Geek — Cámara y Chat (16:9)</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      width: 1920px;
      height: 1080px;
      background: transparent;
    }
  </style>
</head>
<body class="horizontal-canvas">
  <div class="vallegeek-bg-layer"></div>
  <div class="vallegeek-overlay-tint"></div>
  <canvas id="bg-canvas" class="overlay-canvas-bg"></canvas>

  <div class="geek-frame-16x9"></div>

  <!-- Header Superior -->
  <div style="position: absolute; top: 35px; left: 60px; right: 60px; display: flex; justify-content: space-between; align-items: center; z-index: 20;">
    <div style="display: flex; align-items: center; gap: 16px;">
      <div id="streamer-logo" class="vallegeek-hero-logo" style="max-height: 70px;"></div>
      <div class="geek-badge">
        <span class="geek-live-dot"></span>
        <span>EN VIVO</span>
      </div>
    </div>
    <div id="social-bar"></div>
  </div>

  <!-- Marco Cámara Principal -->
  <div class="geek-cam-box" style="top: 130px; left: 60px; width: 1300px; height: 890px;">
    <div class="geek-cam-tag">
      <span class="geek-live-dot"></span>
      <span id="cam-title">CAM PRINCIPAL</span>
    </div>
  </div>

  <!-- Chat Lateral Derecho -->
  <div class="geek-chat-box" style="top: 130px; right: 60px; width: 460px; height: 890px;">
    <div class="geek-chat-header">
      <span class="geek-live-dot"></span>
      <span>CHAT EN VIVO</span>
    </div>
    <div class="geek-chat-list" id="chat-list"></div>
  </div>

  <script src="app.js"></script>
  <script>
    window.valleGeekApp.setupStarParticles('bg-canvas');

    const logoEl = document.getElementById('streamer-logo');
    const camTitleEl = document.getElementById('cam-title');
    const socialBarEl = document.getElementById('social-bar');
    const chatListEl = document.getElementById('chat-list');

    window.valleGeekApp.onChatMessage((user, text) => {
      if (!chatListEl) return;
      const msg = document.createElement('div');
      msg.className = 'geek-chat-msg';
      msg.innerHTML = `<div class="user">${user}</div><div class="text">${text}</div>`;
      chatListEl.appendChild(msg);

      while (chatListEl.children.length > 10) {
        chatListEl.removeChild(chatListEl.firstChild);
      }
    });

    window.valleGeekApp.subscribe((cfg) => {
      window.valleGeekApp.renderHeroLogo(logoEl);
      if (cfg.camTitles && cfg.camTitles.cam1) {
        camTitleEl.innerText = cfg.camTitles.cam1;
      }
      window.valleGeekApp.renderSocialBar(socialBarEl);
    });
  </script>
</body>
</html>
