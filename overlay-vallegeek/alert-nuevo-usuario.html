<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notificación - Nuevo Usuario | Valle Geek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw; height: 100vh;
      background: transparent !important;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Rajdhani', sans-serif;
    }
    :root {
      --primary: #00e5ff;
      --primary-rgb: 0, 229, 255;
      --accent: #ff7b00;
      --accent-rgb: 255, 123, 0;
      --bg-glass: rgba(10, 15, 26, 0.9);
      --border-color: rgba(0, 229, 255, 0.45);
    }
    #alert-stage {
      position: relative; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .user-alert-card {
      position: absolute;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--bg-glass);
      border: 2px solid var(--border-color);
      border-radius: 20px;
      padding: 24px 44px;
      text-align: center;
      backdrop-filter: blur(16px);
      box-shadow: 0 0 30px rgba(var(--primary-rgb), 0.35), 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(var(--primary-rgb), 0.15);
      opacity: 0; transform: scale(0.65) translateY(40px);
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      max-width: 90vw; min-width: 420px; z-index: 1000;
    }
    .user-alert-card.show { opacity: 1; transform: scale(1) translateY(0); animation: pulseGlow 2.5s infinite ease-in-out; }
    .user-alert-card.hide { opacity: 0; transform: scale(0.85) translateY(-40px); transition: all 0.45s ease-in; }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 25px rgba(var(--primary-rgb), 0.3), 0 20px 50px rgba(0, 0, 0, 0.8); border-color: rgba(var(--primary-rgb), 0.4); }
      50% { box-shadow: 0 0 50px rgba(var(--primary-rgb), 0.6), 0 25px 60px rgba(0, 0, 0, 0.9); border-color: rgba(var(--primary-rgb), 0.9); }
    }
    .alert-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, rgba(var(--primary-rgb), 0.25), rgba(var(--accent-rgb), 0.25));
      border: 1px solid var(--primary);
      padding: 6px 18px; border-radius: 999px;
      font-size: 14px; font-weight: 800; letter-spacing: 2px;
      text-transform: uppercase; color: #ffffff;
      margin-bottom: 14px; box-shadow: 0 0 15px rgba(var(--primary-rgb), 0.4);
    }
    .badge-icon { font-size: 16px; animation: spinBounce 2s infinite ease-in-out; }
    @keyframes spinBounce { 0%, 100% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(15deg) scale(1.2); } }
    .alert-username {
      font-family: 'Orbitron', sans-serif; font-size: 38px; font-weight: 900;
      color: #ffffff; text-shadow: 0 0 15px rgba(var(--primary-rgb), 0.8), 0 0 30px rgba(var(--primary-rgb), 0.5);
      letter-spacing: 1.5px; word-break: break-word; line-height: 1.15; margin-bottom: 6px;
    }
    .alert-message {
      font-family: 'Rajdhani', sans-serif; font-size: 26px; font-weight: 800;
      color: var(--primary); text-transform: uppercase; letter-spacing: 3.5px;
      text-shadow: 0 0 12px rgba(var(--primary-rgb), 0.6);
    }
    .cyber-ring {
      position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px;
      border-radius: 26px; border: 2px dashed rgba(var(--primary-rgb), 0.35);
      pointer-events: none; animation: rotateRing 15s linear infinite;
    }
    @keyframes rotateRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @media (max-aspect-ratio: 1/1) {
      .user-alert-card { min-width: 320px; padding: 20px 28px; }
      .alert-username { font-size: 30px; }
      .alert-message { font-size: 22px; letter-spacing: 2px; }
      .alert-badge { font-size: 12px; padding: 5px 14px; }
    }
  </style>
</head>
<body>
  <div id="alert-stage">
    <div id="alert-card" class="user-alert-card">
      <div class="cyber-ring"></div>
      <div class="alert-badge">
        <span class="badge-icon">👋</span>
        <span>¡NUEVO ESPECTADOR!</span>
      </div>
      <div id="alert-user" class="alert-username">@Usuario</div>
      <div class="alert-message">LLEGÓ AL CHAT</div>
    </div>
  </div>
  <script>
    function playChime() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const now = ctx.currentTime;
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain = ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(587.33, now);
        osc1.frequency.exponentialRampToValueAtTime(880, now + 0.15);
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(880, now);
        osc2.frequency.exponentialRampToValueAtTime(1174.66, now + 0.25);
        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.18, now + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
        osc1.connect(gain); osc2.connect(gain); gain.connect(ctx.destination);
        osc1.start(now); osc2.start(now); osc1.stop(now + 0.75);
      } catch (e) {}
    }
  </script>
  <script src="app.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const durationParam = parseInt(urlParams.get('duration') || '5', 10) * 1000;
    const alertCard = document.getElementById('alert-card');
    const alertUser = document.getElementById('alert-user');
    const queue = [];
    let isShowing = false;

    function triggerUserAlert(username) {
      if (!username) return;
      queue.push(username);
      if (!isShowing) processQueue();
    }

    function processQueue() {
      if (queue.length === 0) { isShowing = false; return; }
      isShowing = true;
      const user = queue.shift();
      alertUser.innerText = user.startsWith('@') ? user : `@${user}`;
      alertCard.classList.remove('hide');
      alertCard.classList.add('show');
      playChime();
      setTimeout(() => {
        alertCard.classList.remove('show');
        alertCard.classList.add('hide');
        setTimeout(() => { processQueue(); }, 550);
      }, durationParam);
    }

    if (window.valleGeekApp && typeof window.valleGeekApp.onUserJoined === 'function') {
      window.valleGeekApp.onUserJoined((user) => triggerUserAlert(user));
    }
    if (urlParams.has('test') || urlParams.has('user')) {
      const testUser = urlParams.get('user') || 'ValleGeekUser';
      setTimeout(() => triggerUserAlert(testUser), 800);
    }
  </script>
</body>
</html>
