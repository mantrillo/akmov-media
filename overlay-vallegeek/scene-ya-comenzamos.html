<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valle Geek — Ya Comenzamos (16:9)</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      width: 1920px;
      height: 1080px;
      background: transparent;
    }
  </style>
</head>
<body class="horizontal-canvas">
  <!-- Fondo Artístico Valle Geek con Partículas -->
  <div class="vallegeek-bg-layer"></div>
  <div class="vallegeek-overlay-tint"></div>
  <canvas id="bg-canvas" class="overlay-canvas-bg"></canvas>

  <!-- Marco Exterior Cyberpunk -->
  <div class="geek-frame-16x9"></div>

  <!-- Cinta Ticker Superior -->
  <div class="geek-ticker-ribbon">
    <div class="geek-ticker-content" id="ticker-content">
      <span>VALLE GEEK</span>
      <span>CULTURA POP</span>
      <span>GAMING & ESPORTS</span>
      <span>COMUNIDAD VALLENAR & HUASCO</span>
      <span>VALLE GEEK</span>
      <span>CULTURA POP</span>
      <span>GAMING & ESPORTS</span>
      <span>COMUNIDAD VALLENAR & HUASCO</span>
    </div>
  </div>

  <!-- Hero Central: Logo + Subtítulo + Cuenta Regresiva -->
  <div style="position: absolute; top: 48%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; text-align: center; z-index: 20; width: 100%;">
    <div id="streamer-logo" class="vallegeek-hero-logo"></div>

    <div id="streamer-subtitle" style="font-family: var(--font-display); font-size: 26px; font-weight: 800; letter-spacing: 6px; color: #fff; margin-top: 14px; text-shadow: 0 0 15px rgba(0, 229, 255, 0.7);">
      CULTURA POP • GAMING • COMUNIDAD
    </div>

    <!-- Cuenta Regresiva -->
    <div class="geek-timer-box">
      <span class="geek-timer-label" id="status-text">INICIAMOS EN</span>
      <span class="geek-timer-digits" id="timer-digits">05:00</span>
    </div>
  </div>

  <!-- Chat Flotante Inferior Izquierdo -->
  <div class="geek-chat-box" style="bottom: 50px; left: 60px; width: 440px; height: 260px;">
    <div class="geek-chat-header">
      <span class="geek-live-dot"></span>
      <span>CHAT DE LA COMUNIDAD</span>
    </div>
    <div class="geek-chat-list" id="chat-list"></div>
  </div>

  <!-- Barra de Redes Sociales Inferior Derecha -->
  <div style="position: absolute; bottom: 50px; right: 60px; z-index: 20;" id="social-bar"></div>

  <script src="app.js"></script>
  <script>
    window.valleGeekApp.setupStarParticles('bg-canvas');

    const logoEl = document.getElementById('streamer-logo');
    const subtitleEl = document.getElementById('streamer-subtitle');
    const statusTextEl = document.getElementById('status-text');
    const timerDigitsEl = document.getElementById('timer-digits');
    const tickerContentEl = document.getElementById('ticker-content');
    const socialBarEl = document.getElementById('social-bar');
    const chatListEl = document.getElementById('chat-list');

    window.valleGeekApp.onChatMessage((user, text) => {
      if (!chatListEl) return;
      const msg = document.createElement('div');
      msg.className = 'geek-chat-msg';
      msg.innerHTML = `<div class="user">${user}</div><div class="text">${text}</div>`;
      chatListEl.appendChild(msg);

      while (chatListEl.children.length > 4) {
        chatListEl.removeChild(chatListEl.firstChild);
      }
    });

    window.valleGeekApp.subscribe((cfg) => {
      window.valleGeekApp.renderHeroLogo(logoEl);
      if (cfg.subtitle) subtitleEl.innerText = cfg.subtitle;
      if (cfg.statusStarting) statusTextEl.innerText = cfg.statusStarting;

      if (cfg.tickerText) {
        tickerContentEl.innerHTML = `
          <span>${cfg.tickerText}</span>
          <span>${cfg.tickerText}</span>
        `;
      }

      if (cfg.timer) {
        timerDigitsEl.innerText = window.valleGeekApp.formatTimer(cfg.timer.remainingSeconds);
      }

      window.valleGeekApp.renderSocialBar(socialBarEl);
    });

    // Auto-start timer on OBS load
    function autoStartCountdown() {
      if (window.valleGeekApp && window.valleGeekApp.config) {
        if (!window.valleGeekApp.config.timer.isRunning) {
          window.valleGeekApp.startTimer();
        }
      }
    }

    if (window.obsstudio) {
      window.addEventListener('obsSourceVisibleChanged', (e) => {
        if (e.detail && e.detail.visible) autoStartCountdown();
      });
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) autoStartCountdown();
    });

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(autoStartCountdown, 800);
    });
  </script>
</body>
</html>
