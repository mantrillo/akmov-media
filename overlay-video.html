<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKMOV MEDIA — Overlay de Video</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Oswald:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-black: #000000;
      --color-white: #ffffff;
      --color-neon: #00ff00;
      --color-neon-dim: rgba(0, 255, 0, 0.15);
      --color-yellow: #ffff00;
      --font-display: 'Oswald', sans-serif;
      --font-sans: 'Montserrat', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: transparent;
      color: var(--color-white);
      font-family: var(--font-sans);
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      position: relative;
    }

    /* AKMOV MEDIA WATERMARK - TOP RIGHT */
    .brand-watermark {
      position: absolute;
      top: 40px;
      right: 40px;
      display: flex;
      align-items: center;
      gap: 15px;
      background-color: rgba(0, 0, 0, 0.7);
      border: 2px solid var(--color-neon);
      padding: 8px 18px;
      box-shadow: 4px 4px 0 var(--color-black);
      z-index: 10;
      animation: pulse-logo 4s infinite ease-in-out;
    }

    .brand-logo-text {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--color-white);
      text-transform: uppercase;
      text-shadow: -1px 1px 0 var(--color-black), -2px 2px 0 var(--color-neon);
    }

    .brand-logo-text span {
      color: var(--color-neon);
    }

    /* Rotating Brutalist Sparkle Star */
    .sparkle-icon {
      width: 24px;
      height: 24px;
      color: var(--color-neon);
      animation: rotate-sparkle 8s infinite linear;
      filter: drop-shadow(0 0 5px var(--color-neon));
    }

    @keyframes rotate-sparkle {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulse-logo {
      0%, 100% {
        opacity: 0.6;
        transform: scale(0.98);
      }
      50% {
        opacity: 1;
        transform: scale(1.02);
      }
    }

    /* BANNER CONTAINER - TOP LEFT SLIDE */
    .banner-container {
      position: absolute;
      top: 40px;
      left: 40px;
      transform: translateX(calc(-100% - 60px)); /* Initially hidden off-screen to the left */
      width: 650px;
      height: 140px;
      border: 4px solid var(--color-black);
      outline: 3px solid var(--color-neon);
      background-color: var(--color-black);
      box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.85);
      z-index: 5;
      overflow: hidden;
      opacity: 0;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
    }

    .banner-container.active {
      transform: translateX(0);
      opacity: 1;
    }

    /* Image mode for banners */
    .banner-image {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: none;
    }

    /* Default styled banner in case no image is available */
    .banner-default {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      background: linear-gradient(135deg, var(--color-black) 40%, rgba(0, 255, 0, 0.15));
      position: relative;
    }

    .banner-default::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(0, 255, 0, 0.03) 1px, transparent 1px);
      background-size: 100% 10px;
      pointer-events: none;
    }

    .banner-default-left {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .banner-tag {
      background-color: var(--color-neon);
      color: var(--color-black);
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.75rem;
      padding: 2px 8px;
      align-self: flex-start;
      border: 1px solid var(--color-black);
      box-shadow: 2px 2px 0 var(--color-black);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .banner-title {
      font-family: var(--font-display);
      font-size: 2.2rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 2px 2px 0 rgba(0, 255, 0, 0.2);
    }

    .banner-subtitle {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      color: #aaa;
    }

    .banner-default-right {
      text-align: right;
    }

    .banner-promo {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--color-yellow);
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- PULSING LOGO -->
  <div class="brand-watermark">
    <svg class="sparkle-icon" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2L15 9L22 12L15 15L12 22L9 15L2 12L9 9Z"/>
    </svg>
    <div class="brand-logo-text">AKMOV<span>MEDIA</span></div>
  </div>

  <!-- POPUP BANNER -->
  <div class="banner-container" id="banner-container">
    <!-- Banner Image Mode -->
    <div class="banner-image" id="banner-image"></div>
    
    <!-- Banner Default/Fallback Mode -->
    <div class="banner-default" id="banner-default">
      <div class="banner-default-left">
        <span class="banner-tag" id="banner-tag">PUBLICIDAD</span>
        <div class="banner-title" id="banner-title">AKMOV MEDIA</div>
        <div class="banner-subtitle" id="banner-subtitle">Conectando la Región de Atacama</div>
      </div>
      <div class="banner-default-right">
        <div class="banner-promo" id="banner-promo">SIGUE LA TRANSMISIÓN</div>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const apiBase = urlParams.get('api') || 'https://api.akmovmedia.com';
    const songsInterval = parseInt(urlParams.get('interval')) || 5; // Banner se activa cada N canciones (por defecto 5)
    const displayDuration = parseInt(urlParams.get('duration')) || 5000; // Duración máxima en pantalla (por defecto 5s)
    
    const bannerContainer = document.getElementById('banner-container');
    const bannerImage = document.getElementById('banner-image');
    const bannerDefault = document.getElementById('banner-default');
    
    // Default fallback banners (local to publicaciones directory)
    const fallbackBanners = [
      'publicaciones/post_1_el_gancho.png',
      'publicaciones/post_2_la_muestra.png',
      'publicaciones/post_3_la_casa_nueva.png',
      'publicaciones/post_4_cta.png'
    ];

    let bannerList = [];
    let activeTimeout;
    let songCounter = 0;

    // Load banner list from backend
    async function loadBanners() {
      try {
        const res = await fetch(`${apiBase}/api/banners`);
        if (!res.ok) throw new Error('Status not ok');
        const data = await res.json();
        
        if (Array.isArray(data) && data.length > 0) {
          // Prepend path
          bannerList = data.map(filename => `banners/${filename}`);
        } else {
          bannerList = [...fallbackBanners];
        }
      } catch (err) {
        console.warn('Error loading banners from backend. Using fallback list:', err.message);
        bannerList = [...fallbackBanners];
      }
    }

    // Trigger banner animation
    function triggerBanner() {
      if (bannerList.length === 0) return;
      
      // Select a random banner
      const randomBanner = bannerList[Math.floor(Math.random() * bannerList.length)];
      
      // Clear any running timeout
      clearTimeout(activeTimeout);
      
      // Hide banner first to reset transition if already active
      bannerContainer.classList.remove('active');
      
      setTimeout(() => {
        // Apply image background
        bannerImage.style.backgroundImage = `url('${randomBanner}')`;
        bannerImage.style.display = 'block';
        bannerDefault.style.display = 'none';

        // Slide in from top-left
        bannerContainer.classList.add('active');

        // Stay for max 5 seconds, then slide out to the left
        activeTimeout = setTimeout(() => {
          bannerContainer.classList.remove('active');
        }, displayDuration);
      }, 500);
    }

    // SSE Integration to trigger banner every 5 songs/video changes
    function connectSSE() {
      try {
        const eventSource = new EventSource(`${apiBase}/alerts/stream`);
        
        eventSource.onmessage = (event) => {
          const alertData = JSON.parse(event.data);
          // Trigger when a new video / now-playing track starts
          if (alertData.dataType === 'NOW_PLAYING') {
            songCounter++;
            console.log(`Canción cambiada. Contador actual: ${songCounter}/${songsInterval}`);
            if (songCounter >= songsInterval) {
              songCounter = 0;
              console.log(`Desplegando banner (${songsInterval} canciones completadas)...`);
              triggerBanner();
            }
          }
        };

        eventSource.onerror = (err) => {
          console.warn('Error en la conexión SSE. Reintentando en 5 segundos...');
          eventSource.close();
          setTimeout(connectSSE, 5000);
        };
      } catch (e) {
        console.warn('No se pudo establecer la conexión SSE para eventos dinámicos.');
      }
    }

    // Start everything
    async function init() {
      await loadBanners();
      
      // Si la URL incluye ?test=true, dispara el banner inmediatamente al cargar
      if (urlParams.get('test') === 'true') {
        triggerBanner();
      }
      
      // Setup SSE to watch for video changes
      connectSSE();
      
      // Periodically reload banners list every 60 seconds to detect new uploads
      setInterval(loadBanners, 60000);
    }

    init();
  </script>
</body>
</html>
