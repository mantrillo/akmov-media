<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay de Alertas de Chat | AKMOV Media</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700;800&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background: transparent !important;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Rajdhani', sans-serif;
    }

    :root {
      --primary: #00ff66;
      --primary-rgb: 0, 255, 102;
      --accent: #00e5ff;
      --accent-rgb: 0, 229, 255;
      --bg-glass: rgba(10, 15, 20, 0.88);
      --border-color: rgba(0, 255, 102, 0.4);
    }

    #alert-stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .alert-card {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-glass);
      border: 2px solid var(--border-color);
      border-radius: 20px;
      padding: 24px 44px;
      text-align: center;
      backdrop-filter: blur(16px);
      box-shadow: 
        0 0 30px rgba(var(--primary-rgb), 0.35),
        0 20px 50px rgba(0, 0, 0, 0.8),
        inset 0 0 20px rgba(var(--primary-rgb), 0.15);
      opacity: 0;
      transform: scale(0.65) translateY(40px);
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      max-width: 90vw;
      min-width: 420px;
      z-index: 1000;
    }

    .alert-card.show {
      opacity: 1;
      transform: scale(1) translateY(0);
      animation: pulseGlow 2.5s infinite ease-in-out;
    }

    .alert-card.hide {
      opacity: 0;
      transform: scale(0.85) translateY(-40px);
      transition: all 0.45s ease-in;
    }

    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 25px rgba(var(--primary-rgb), 0.3), 0 20px 50px rgba(0, 0, 0, 0.8);
        border-color: rgba(var(--primary-rgb), 0.4);
      }
      50% {
        box-shadow: 0 0 50px rgba(var(--primary-rgb), 0.6), 0 25px 60px rgba(0, 0, 0, 0.9);
        border-color: rgba(var(--primary-rgb), 0.9);
      }
    }

    .alert-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, rgba(var(--primary-rgb), 0.25), rgba(var(--accent-rgb), 0.25));
      border: 1px solid var(--primary);
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 14px;
      box-shadow: 0 0 15px rgba(var(--primary-rgb), 0.4);
    }

    .alert-main-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 38px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 15px rgba(var(--primary-rgb), 0.8);
      letter-spacing: 1.5px;
      margin-bottom: 6px;
      line-height: 1.15;
    }

    .alert-sub-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 3.5px;
      text-shadow: 0 0 12px rgba(var(--primary-rgb), 0.6);
    }

    .old-name-strike {
      font-size: 22px;
      font-weight: 700;
      color: #94a3b8;
      text-decoration: line-through;
      margin-bottom: 4px;
    }

    .cyber-ring {
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      border-radius: 26px;
      border: 2px dashed rgba(var(--primary-rgb), 0.35);
      pointer-events: none;
      animation: rotateRing 15s linear infinite;
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-aspect-ratio: 1/1) {
      .alert-card {
        min-width: 320px;
        padding: 20px 28px;
      }
      .alert-main-title {
        font-size: 30px;
      }
      .alert-sub-title {
        font-size: 22px;
        letter-spacing: 2px;
      }
    }
  </style>
</head>
<body>
  <div id="alert-stage">
    <div id="alert-card" class="alert-card">
      <div class="cyber-ring"></div>
      <div id="alert-badge" class="alert-badge">
        <span id="badge-icon">👋</span>
        <span id="badge-text">¡NUEVO ESPECTADOR!</span>
      </div>
      <div id="alert-old" class="old-name-strike" style="display:none;"></div>
      <div id="alert-title" class="alert-main-title">@Usuario</div>
      <div id="alert-sub" class="alert-sub-title">LLEGÓ AL CHAT</div>
    </div>
  </div>

  <script>
    function playChime(isRename = false) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const now = ctx.currentTime;
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain = ctx.createGain();

        if (isRename) {
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(440, now);
          osc1.frequency.exponentialRampToValueAtTime(880, now + 0.2);
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(554.37, now);
          osc2.frequency.exponentialRampToValueAtTime(1108.73, now + 0.25);
        } else {
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(587.33, now);
          osc1.frequency.exponentialRampToValueAtTime(880, now + 0.15);
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(880, now);
          osc2.frequency.exponentialRampToValueAtTime(1174.66, now + 0.25);
        }

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.18, now + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(ctx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.75);
      } catch (e) {}
    }
  </script>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const serverUrlParam = urlParams.get('streamurl') || urlParams.get('owncast') || 'https://stream.akmovmedia.com';
    const durationParam = parseInt(urlParams.get('duration') || '5.5', 10) * 1000;

    const alertCard = document.getElementById('alert-card');
    const alertBadge = document.getElementById('alert-badge');
    const badgeIcon = document.getElementById('badge-icon');
    const badgeText = document.getElementById('badge-text');
    const alertOld = document.getElementById('alert-old');
    const alertTitle = document.getElementById('alert-title');
    const alertSub = document.getElementById('alert-sub');

    const queue = [];
    let isShowing = false;

    function queueAlert(type, payload) {
      queue.push({ type, payload });
      if (!isShowing) processQueue();
    }

    function processQueue() {
      if (queue.length === 0) {
        isShowing = false;
        return;
      }

      isShowing = true;
      const item = queue.shift();

      if (item.type === 'USER_JOINED') {
        document.documentElement.style.setProperty('--primary', '#00ff66');
        document.documentElement.style.setProperty('--primary-rgb', '0, 255, 102');
        badgeIcon.innerText = '👋';
        badgeText.innerText = '¡NUEVO ESPECTADOR!';
        alertOld.style.display = 'none';
        alertTitle.innerText = item.payload.startsWith('@') ? item.payload : `@${item.payload}`;
        alertSub.innerText = 'LLEGÓ AL CHAT';
        playChime(false);
      } else if (item.type === 'NAME_CHANGE') {
        document.documentElement.style.setProperty('--primary', '#00e5ff');
        document.documentElement.style.setProperty('--primary-rgb', '0, 229, 255');
        badgeIcon.innerText = '🔄';
        badgeText.innerText = 'CAMBIO DE NOMBRE';
        alertOld.style.display = 'block';
        alertOld.innerText = item.payload.oldName.startsWith('@') ? item.payload.oldName : `@${item.payload.oldName}`;
        alertTitle.innerText = item.payload.newName.startsWith('@') ? item.payload.newName : `@${item.payload.newName}`;
        alertSub.innerText = 'AHORA SE LLAMA';
        playChime(true);
      }

      alertCard.classList.remove('hide');
      alertCard.classList.add('show');

      setTimeout(() => {
        alertCard.classList.remove('show');
        alertCard.classList.add('hide');

        setTimeout(() => {
          processQueue();
        }, 550);
      }, durationParam);
    }

    // 1. BroadcastChannel listeners
    if (typeof BroadcastChannel !== 'undefined') {
      ['akmov_overlay_channel', 'vallegeek_overlay_channel', 'ruedas_overlay_channel'].forEach((chName) => {
        try {
          const bc = new BroadcastChannel(chName);
          bc.onmessage = (event) => {
            if (event.data && event.data.type === 'USER_JOINED' && event.data.user) {
              queueAlert('USER_JOINED', event.data.user);
            } else if (event.data && event.data.type === 'NAME_CHANGE' && event.data.oldName && event.data.newName) {
              queueAlert('NAME_CHANGE', { oldName: event.data.oldName, newName: event.data.newName });
            }
          };
        } catch (e) {}
      });
    }

    // 2. Direct Live Owncast Connection with Token Auth
    async function connectOwncastDirect() {
      const candidates = [
        serverUrlParam,
        'https://stream.akmovmedia.com',
        'http://192.168.1.15:8080',
        'http://localhost:8080'
      ];
      const unique = [...new Set(candidates.filter(Boolean))];

      for (const base of unique) {
        try {
          const cleanBase = base.replace(/\/+$/, '');
          let token = null;
          try {
            const reg = await fetch(`${cleanBase}/api/chat/register`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ displayName: 'AlertOverlay' })
            });
            if (reg.ok) {
              const data = await reg.json();
              token = data.accessToken;
            }
          } catch(e) {}

          let wsUrl = cleanBase.replace(/^http/, 'ws') + '/ws';
          if (token) wsUrl += '?accessToken=' + encodeURIComponent(token);

          const socket = new WebSocket(wsUrl);
          socket.onmessage = (event) => {
            try {
              const d = JSON.parse(event.data);
              if (d.type === 'USER_JOINED') {
                const u = d.user?.displayName || d.user?.name || d.eventData?.user?.displayName || d.body || 'Usuario';
                queueAlert('USER_JOINED', u);
              } else if (d.type === 'NAME_CHANGE') {
                const oldN = d.oldName || d.user?.previousNames?.[d.user?.previousNames?.length - 1] || 'Usuario';
                const newN = d.newName || d.user?.displayName || 'Usuario';
                queueAlert('NAME_CHANGE', { oldName: oldN, newName: newN });
              }
            } catch(e) {}
          };
          socket.onclose = () => {
            setTimeout(connectOwncastDirect, 5000);
          };
          break;
        } catch(e) {}
      }
    }

    connectOwncastDirect();

    // 3. Test mode via URL params
    if (urlParams.has('test') || urlParams.has('user')) {
      const u = urlParams.get('user') || 'Mantrillo';
      setTimeout(() => queueAlert('USER_JOINED', u), 600);
    }
    if (urlParams.has('testrename') || (urlParams.has('old') && urlParams.has('new'))) {
      const o = urlParams.get('old') || 'NikoAntiguo';
      const n = urlParams.get('new') || 'NikoProGamer';
      setTimeout(() => queueAlert('NAME_CHANGE', { oldName: o, newName: n }), 1800);
    }
  </script>
</body>
</html>
