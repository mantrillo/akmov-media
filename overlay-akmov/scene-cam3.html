<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAM 3 - Overlay Streaming</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body, html {
      background-color: transparent !important;
      background: transparent !important;
    }
  </style>
</head>
<body>
  <div class="scene-container">
    <div class="scene-cam-single-layout">
      <!-- Full Frame Cut Corners -->
      <div class="cam-single-frame"></div>
      
      <!-- Top Right Corner Badge -->
      <div class="cam-tag-corner" id="cam-angle-tag">CAM 3</div>

      <!-- Bottom Left Live Badge -->
      <div class="cam-single-badge">
        <span class="live-indicator-dot"></span>
        <span id="cam-title">AKMOVMEDIA</span>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    window.overlayApp.setupBackground('scene-cam3.html');
    const camTitleEl = document.getElementById('cam-title');
    const angleTagEl = document.getElementById('cam-angle-tag');

    window.overlayApp.subscribe((config) => {
      const name = config.streamerName !== undefined ? config.streamerName : 'AKMOVMEDIA';
      camTitleEl.innerText = name;
      const badge = document.querySelector('.cam-single-badge');
      if (badge) {
        badge.style.display = name.trim() ? 'flex' : 'none';
      }
      const angle = (config.camTitles && config.camTitles.cam3 !== undefined) ? config.camTitles.cam3 : 'CAM 3';
      angleTagEl.innerText = angle;
      angleTagEl.style.display = angle.trim() ? 'block' : 'none';
    });
  </script>
</body>
</html>
