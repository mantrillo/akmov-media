<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escena: Reacción Dual (2 Locutores) - Overlay Streaming</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body, html {
      background-color: transparent !important;
      background: transparent !important;
    }
  </style>
</head>
<body>
  <!-- Ambient background subtle elements -->
  <div class="scene-solid-bg" style="opacity: 0.95;"></div>
  <div class="tech-ambient-lines" style="opacity: 0.35;"></div>
  <canvas id="bg-canvas" class="overlay-canvas-bg"></canvas>

  <div class="scene-container">
    <!-- Top Brand Pattern / Header Bar -->
    <div class="top-brand-pattern">
      <div id="reaccion-dual-brand-title" class="brand-pattern-title">AKMOVMEDIA • REACCIÓN DUAL</div>
      <div id="reaccion-dual-brand-ticker" style="color: rgba(255,255,255,0.7); font-size: 14px; letter-spacing: 2px; font-weight: 700;">
        2 HOSTS LIVE ON STREAM
      </div>
    </div>

    <!-- Layout Dual Reaction: Pantalla de Contenido a la izquierda + 2 Locutores apilados a la derecha -->
    <div class="scene-reaccion-dual-layout">
      <!-- Pantalla Principal de Contenido / Video / Gameplay para reaccionar -->
      <div class="reaccion-dual-media-frame"></div>

      <!-- Columna Derecha: 2 Cámaras de Locutores Sincronizados -->
      <div class="dual-hosts-col">
        <!-- Locutor 1 / Anfitrión -->
        <div class="dual-host-cam-box">
          <div class="dual-host-cam-frame"></div>
          <div class="dual-host-tag" id="tag-host1">
            <span class="live-indicator-dot"></span>
            <span id="locutor1-name">LOCUTOR 1</span>
          </div>
        </div>

        <!-- Locutor 2 / Co-Anfitrión o Invitado -->
        <div class="dual-host-cam-box">
          <div class="dual-host-cam-frame"></div>
          <div class="dual-host-tag" id="tag-host2">
            <span class="live-indicator-dot"></span>
            <span id="locutor2-name">LOCUTOR 2</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Barra de Chat Scroll Horizontal al Fondo -->
    <div class="chat-linear-bottom-bar" id="chat-linear-bar">
      <div class="chat-linear-badge">
        <span class="live-indicator-dot"></span>
        <span>CHAT</span>
      </div>
      <div class="chat-linear-track" id="linear-chat-track"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    window.overlayApp.setupBackground('scene-reaccion-dual.html');
    const brandTitleEl = document.getElementById('reaccion-dual-brand-title');
    const locutor1El = document.getElementById('locutor1-name');
    const locutor2El = document.getElementById('locutor2-name');
    const tagHost1 = document.getElementById('tag-host1');
    const tagHost2 = document.getElementById('tag-host2');
    const socialBarEl = document.getElementById('social-bar');
    const linearChatTrack = document.getElementById('linear-chat-track');

    window.overlayApp.onChatMessage((user, text) => {
      if (!linearChatTrack) return;
      const msgEl = document.createElement('div');
      msgEl.className = 'chat-linear-msg';
      msgEl.innerHTML = `
        <span class="chat-linear-user">${user}:</span>
        <span class="chat-linear-text">${text}</span>
      `;
      linearChatTrack.appendChild(msgEl);
      while (linearChatTrack.children.length > 12) {
        linearChatTrack.removeChild(linearChatTrack.firstChild);
      }
      linearChatTrack.scrollLeft = linearChatTrack.scrollWidth;
    });

    window.overlayApp.subscribe((config) => {
      const streamer = config.streamerName !== undefined ? config.streamerName : 'AKMOVMEDIA';
      const host1 = config.hostName !== undefined ? config.hostName : (streamer || 'LOCUTOR 1');
      const host2 = config.guestName !== undefined ? config.guestName : 'LOCUTOR 2';

      brandTitleEl.innerText = streamer.trim() ? `${streamer} • REACCIÓN DUAL` : 'REACCIÓN DUAL';
      
      locutor1El.innerText = host1;
      tagHost1.style.display = host1.trim() ? 'flex' : 'none';

      locutor2El.innerText = host2;
      tagHost2.style.display = host2.trim() ? 'flex' : 'none';

      window.overlayApp.renderSocialBar(socialBarEl);
    });
  </script>
</body>
</html>
