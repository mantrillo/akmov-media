<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notificación - Nuevo Usuario | AKMOV Media</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700;800&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background: transparent !important;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Rajdhani', sans-serif;
    }

    :root {
      --primary: #00ff66;
      --primary-rgb: 0, 255, 102;
      --accent: #00e5ff;
      --accent-rgb: 0, 229, 255;
      --bg-glass: rgba(10, 15, 20, 0.88);
      --border-color: rgba(0, 255, 102, 0.4);
    }

    /* Container for Alerts */
    #alert-stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    /* Floating Alert Card */
    .user-alert-card {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-glass);
      border: 2px solid var(--border-color);
      border-radius: 20px;
      padding: 24px 44px;
      text-align: center;
      backdrop-filter: blur(16px);
      box-shadow: 
        0 0 30px rgba(var(--primary-rgb), 0.35),
        0 20px 50px rgba(0, 0, 0, 0.8),
        inset 0 0 20px rgba(var(--primary-rgb), 0.15);
      opacity: 0;
      transform: scale(0.65) translateY(40px);
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      max-width: 90vw;
      min-width: 420px;
      z-index: 1000;
    }

    .user-alert-card.show {
      opacity: 1;
      transform: scale(1) translateY(0);
      animation: pulseGlow 2.5s infinite ease-in-out;
    }

    .user-alert-card.hide {
      opacity: 0;
      transform: scale(0.85) translateY(-40px);
      transition: all 0.45s ease-in;
    }

    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 
          0 0 25px rgba(var(--primary-rgb), 0.3),
          0 20px 50px rgba(0, 0, 0, 0.8),
          inset 0 0 15px rgba(var(--primary-rgb), 0.1);
        border-color: rgba(var(--primary-rgb), 0.4);
      }
      50% {
        box-shadow: 
          0 0 50px rgba(var(--primary-rgb), 0.6),
          0 25px 60px rgba(0, 0, 0, 0.9),
          inset 0 0 30px rgba(var(--primary-rgb), 0.3);
        border-color: rgba(var(--primary-rgb), 0.9);
      }
    }

    /* Cyber Top Header Pill */
    .alert-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, rgba(var(--primary-rgb), 0.25), rgba(var(--accent-rgb), 0.25));
      border: 1px solid var(--primary);
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 14px;
      box-shadow: 0 0 15px rgba(var(--primary-rgb), 0.4);
    }

    .badge-icon {
      font-size: 16px;
      animation: spinBounce 2s infinite ease-in-out;
    }

    @keyframes spinBounce {
      0%, 100% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(15deg) scale(1.2); }
    }

    /* Username Highlight */
    .alert-username {
      font-family: 'Orbitron', sans-serif;
      font-size: 38px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 
        0 0 15px rgba(var(--primary-rgb), 0.8),
        0 0 30px rgba(var(--primary-rgb), 0.5);
      letter-spacing: 1.5px;
      word-break: break-word;
      line-height: 1.15;
      margin-bottom: 6px;
    }

    /* Action Message */
    .alert-message {
      font-family: 'Rajdhani', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 3.5px;
      text-shadow: 0 0 12px rgba(var(--primary-rgb), 0.6);
    }

    /* Particle Burst / Ring Effect */
    .cyber-ring {
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      border-radius: 26px;
      border: 2px dashed rgba(var(--primary-rgb), 0.35);
      pointer-events: none;
      animation: rotateRing 15s linear infinite;
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Vertical Scene Adaptation (Mobile / 9:16) */
    @media (max-aspect-ratio: 1/1) {
      .user-alert-card {
        min-width: 320px;
        padding: 20px 28px;
      }
      .alert-username {
        font-size: 30px;
      }
      .alert-message {
        font-size: 22px;
        letter-spacing: 2px;
      }
      .alert-badge {
        font-size: 12px;
        padding: 5px 14px;
      }
    }
  </style>
</head>
<body>
  <div id="alert-stage">
    <div id="alert-card" class="user-alert-card">
      <div class="cyber-ring"></div>
      <div class="alert-badge">
        <span class="badge-icon">👋</span>
        <span>¡NUEVO ESPECTADOR!</span>
      </div>
      <div id="alert-user" class="alert-username">@Usuario</div>
      <div class="alert-message">LLEGÓ AL CHAT</div>
    </div>
  </div>

  <!-- Audio Chime Synthesizer via Web Audio API -->
  <script>
    function playChime() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        
        const now = ctx.currentTime;
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain = ctx.createGain();

        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(587.33, now); // D5
        osc1.frequency.exponentialRampToValueAtTime(880, now + 0.15); // A5

        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(880, now);
        osc2.frequency.exponentialRampToValueAtTime(1174.66, now + 0.25); // D6

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.18, now + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(ctx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.75);
      } catch (e) {}
    }
  </script>

  <!-- Connection & Queue Engine -->
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const serverUrlParam = urlParams.get('streamurl') || urlParams.get('owncast') || 'https://stream.akmovmedia.com';
    const durationParam = parseInt(urlParams.get('duration') || '5', 10) * 1000;
    const colorParam = urlParams.get('color');

    if (colorParam) {
      const cleanHex = colorParam.replace('#', '');
      document.documentElement.style.setProperty('--primary', '#' + cleanHex);
    }

    const alertCard = document.getElementById('alert-card');
    const alertUser = document.getElementById('alert-user');
    const queue = [];
    let isShowing = false;

    function triggerUserAlert(username) {
      if (!username) return;
      queue.push(username);
      if (!isShowing) processQueue();
    }

    function processQueue() {
      if (queue.length === 0) {
        isShowing = false;
        return;
      }

      isShowing = true;
      const user = queue.shift();
      alertUser.innerText = user.startsWith('@') ? user : `@${user}`;

      // Reset class state
      alertCard.classList.remove('hide');
      alertCard.classList.add('show');
      playChime();

      setTimeout(() => {
        alertCard.classList.remove('show');
        alertCard.classList.add('hide');

        setTimeout(() => {
          processQueue();
        }, 550);
      }, durationParam);
    }

    // 1. Listen via BroadcastChannel (synchronized with OBS streamer dashboard & overlays)
    if (typeof BroadcastChannel !== 'undefined') {
      ['akmov_overlay_channel', 'vallegeek_overlay_channel', 'ruedas_overlay_channel'].forEach((chName) => {
        try {
          const bc = new BroadcastChannel(chName);
          bc.onmessage = (event) => {
            if (event.data && event.data.type === 'USER_JOINED' && event.data.user) {
              triggerUserAlert(event.data.user);
            }
          };
        } catch (e) {}
      });
    }

    // 2. Direct Live Owncast Connection with Token Auth
    async function connectOwncastDirect() {
      const candidates = [
        serverUrlParam,
        'https://stream.akmovmedia.com',
        'http://192.168.1.15:8080',
        'http://localhost:8080'
      ];
      const unique = [...new Set(candidates.filter(Boolean))];

      for (const base of unique) {
        try {
          const cleanBase = base.replace(/\/+$/, '');
          // Register token
          let token = null;
          try {
            const reg = await fetch(`${cleanBase}/api/chat/register`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ displayName: 'AlertOverlay' })
            });
            if (reg.ok) {
              const data = await reg.json();
              token = data.accessToken;
            }
          } catch(e) {}

          let wsUrl = cleanBase.replace(/^http/, 'ws') + '/ws';
          if (token) wsUrl += '?accessToken=' + encodeURIComponent(token);

          const socket = new WebSocket(wsUrl);
          socket.onopen = () => {
            console.log('[Alert Overlay] Conectado a Owncast:', wsUrl);
          };
          socket.onmessage = (event) => {
            try {
              const d = JSON.parse(event.data);
              if (d.type === 'USER_JOINED') {
                const u = d.user?.displayName || d.user?.name || d.eventData?.user?.displayName || d.body || 'Usuario';
                triggerUserAlert(u);
              }
            } catch(e) {}
          };
          socket.onclose = () => {
            setTimeout(connectOwncastDirect, 5000);
          };
          break;
        } catch(e) {}
      }
    }

    connectOwncastDirect();

    // 3. Test Mode via URL (e.g. ?test=1 or ?user=NikoGamer)
    if (urlParams.has('test') || urlParams.has('user')) {
      const testUser = urlParams.get('user') || 'Mantrillo';
      setTimeout(() => triggerUserAlert(testUser), 800);
    }
  </script>
</body>
</html>
