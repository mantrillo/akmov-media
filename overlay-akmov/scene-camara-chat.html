<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escena 5: Cámara y Chat - Overlay Streaming</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body, html {
      background-color: transparent !important;
      background: transparent !important;
    }
  </style>
</head>
<body>
  <!-- Ambient background elements -->
  <div class="scene-solid-bg" style="opacity: 0.94;"></div>
  <div class="tech-ambient-lines" style="opacity: 0.3;"></div>
  <canvas id="bg-canvas" class="overlay-canvas-bg"></canvas>

  <div class="scene-container">
    <!-- Cyber Outer Frame -->
    <div class="cyber-outer-frame" style="inset: 20px;">
      <div class="cyber-outer-border"></div>
    </div>

    <!-- Layout Dual: Cámara Principal + Chat Chamfered Box -->
    <div class="scene-cam-chat-layout">
      <!-- Marco Gran Cámara Principal a la Izquierda -->
      <div class="main-cam-container">
        <div class="main-cam-frame"></div>
        
        <!-- Floating Streamer Badge abajo a la derecha de la cámara -->
        <div class="floating-streamer-badge" id="chat-cam-badge">
          <span class="live-indicator-dot" style="display:inline-block; margin-right: 8px;"></span>
          <span id="chat-streamer-name">AKMOVMEDIA</span>
        </div>
      </div>

      <!-- Marco Vertical para Chat con corte de 45° superior derecho (Estilo Pantallazo 5) -->
      <div class="main-chat-container">
        <div class="main-chat-frame">
          <div class="chat-header-bar">
            <div class="chat-header-title">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
              </svg>
              <span>STREAM CHAT</span>
            </div>
            <span class="live-indicator-dot"></span>
          </div>

          <!-- Live Messages Area -->
          <div class="chat-messages-scroll" id="chat-stream-demo"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    window.overlayApp.setupBackground('scene-camara-chat.html');
    const nameEl = document.getElementById('chat-streamer-name');
    const chatContainer = document.getElementById('chat-stream-demo');

    window.overlayApp.subscribe((config) => {
      const name = config.streamerName !== undefined ? config.streamerName : 'AKMOVMEDIA';
      nameEl.innerText = name;
      const badge = document.getElementById('chat-cam-badge');
      if (badge) {
        badge.style.display = name.trim() ? 'flex' : 'none';
      }
    });

    const badgesPool = ['VIP', 'CHAT', 'MOD', 'SUB', 'PRO'];

    window.overlayApp.onChatMessage((user, text) => {
      if (!chatContainer) return;
      const badgeTag = badgesPool[Math.floor(Math.random() * badgesPool.length)];
      const msgEl = document.createElement('div');
      msgEl.className = 'chat-msg-bubble';
      msgEl.innerHTML = `
        <div class="chat-msg-header">
          <div class="chat-user-info">
            <span class="chat-user-badge">${badgeTag}</span>
            <span class="chat-user-name">${user}</span>
          </div>
          <span class="chat-timestamp">LIVE</span>
        </div>
        <div class="chat-text">${text}</div>
      `;
      chatContainer.appendChild(msgEl);

      // Keep only last 15 messages
      while (chatContainer.children.length > 15) {
        chatContainer.removeChild(chatContainer.firstChild);
      }
      chatContainer.scrollTop = chatContainer.scrollHeight;
    });
  </script>
</body>
</html>
