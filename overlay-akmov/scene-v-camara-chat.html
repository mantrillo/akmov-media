<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vertical: Cámara y Chat (9:16)</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      width: 1080px;
      height: 1920px;
      background: transparent;
    }
  </style>
</head>
<body class="vertical-canvas">
  <!-- Ambient & Particle Background -->
  <div class="scene-solid-bg"></div>
  <div class="tech-ambient-lines"></div>
  <div class="tech-radial-glow"></div>
  <canvas id="bg-canvas" class="overlay-canvas-bg"></canvas>

  <div class="v-cyber-frame"></div>

  <!-- Header Superior Vertical -->
  <div class="v-header-branding">
    <div class="v-live-badge">
      <span class="live-dot"></span>
      <span id="live-indicator-text">EN VIVO</span>
    </div>
    <div id="streamer-logo" class="streamer-logo-text">AKMOV<span class="dot">.</span></div>
    <div id="streamer-subtitle" class="streamer-subtitle" style="font-size: 15px; margin-top: 6px; letter-spacing: 4px;">STREAMING & MEDIA</div>
  </div>

  <!-- Marco de Cámara Principal (Facecam) -->
  <div class="v-cam-box center-cam-large">
    <div class="v-cam-label">
      <span class="live-indicator-dot"></span>
      <span id="cam-title">CAM PRINCIPAL</span>
    </div>
  </div>

  <!-- Floating Chat Section Vertical -->
  <div class="v-chat-container">
    <div class="v-chat-header">
      <span class="live-dot" style="width:7px;height:7px;background:var(--neon-primary);border-radius:50%;"></span>
      <span>CHAT DE LA COMUNIDAD</span>
    </div>
    <div class="v-chat-list" id="frameless-chat-list"></div>
  </div>

  <!-- Barra de Redes Sociales Inferior -->
  <div class="v-social-footer" id="social-bar"></div>

  <script src="app.js"></script>
  <script>
    window.overlayApp.setupBackground('scene-v-camara-chat.html');

    const logoEl = document.getElementById('streamer-logo');
    const subtitleEl = document.getElementById('streamer-subtitle');
    const socialBarEl = document.getElementById('social-bar');
    const camTitleEl = document.getElementById('cam-title');
    const framelessChatList = document.getElementById('frameless-chat-list');

    window.overlayApp.onChatMessage((user, text) => {
      if (!framelessChatList) return;
      const msg = document.createElement('div');
      msg.className = 'v-chat-msg';
      msg.innerHTML = `
        <div class="user">${user}</div>
        <div class="text">${text}</div>
      `;
      framelessChatList.appendChild(msg);

      while (framelessChatList.children.length > 5) {
        framelessChatList.removeChild(framelessChatList.firstChild);
      }
    });

    window.overlayApp.subscribe((config) => {
      window.overlayApp.renderHeroLogo(logoEl, { isHeader: true, maxHeight: 75, width: 320 });
      subtitleEl.innerText = config.subtitle || 'STREAMING & MEDIA';
      if (config.camTitles && config.camTitles.cam1) {
        camTitleEl.innerText = config.camTitles.cam1;
      }
      window.overlayApp.renderSocialBar(socialBarEl);
    });
  </script>
</body>
</html>
