<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escena 4: Reacción - Overlay Streaming</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body, html {
      background-color: transparent !important;
      background: transparent !important;
    }
  </style>
</head>
<body>
  <!-- Ambient background subtle elements -->
  <div class="scene-solid-bg" style="opacity: 0.95;"></div>
  <div class="tech-ambient-lines" style="opacity: 0.35;"></div>
  <canvas id="bg-canvas" class="overlay-canvas-bg"></canvas>

  <div class="scene-container">
    <!-- Top Brand Pattern / Ticker Bar -->
    <div class="top-brand-pattern">
      <div id="reaccion-brand-title" class="brand-pattern-title">AKMOVMEDIA • REACCIÓN</div>
      <div id="reaccion-brand-ticker" style="color: rgba(255,255,255,0.7); font-size: 14px; letter-spacing: 2px; font-weight: 700;">
        LIVE ON STREAM
      </div>
    </div>

    <!-- Dual Frame Layout (Webcam a la izquierda + Pantalla de reacción a la derecha) -->
    <div class="scene-reaccion-layout">
      <!-- Columna Cámara -->
      <div class="cam-reaccion-col">
        <div class="reaccion-cam-frame"></div>
        <div class="cam-badge-tag" style="bottom: -15px; left: 20px; right: auto;">
          <span class="live-indicator-dot"></span>
          <span id="reaccion-cam-name">AKMOVMEDIA</span>
        </div>
      </div>

      <!-- Columna Pantalla Contenido / Video / Reacción -->
      <div class="screen-reaccion-col">
        <div class="reaccion-screen-frame"></div>
      </div>
    </div>

    <!-- Barra de Redes Sociales Biselada -->
    <div class="social-bar-container" id="social-bar" style="bottom: 30px;"></div>
  </div>

  <script src="app.js"></script>
  <script>
    window.overlayApp.setupBackground('scene-reaccion.html');
    const brandTitleEl = document.getElementById('reaccion-brand-title');
    const camNameEl = document.getElementById('reaccion-cam-name');
    const socialBarEl = document.getElementById('social-bar');

    window.overlayApp.subscribe((config) => {
      const name = config.streamerName !== undefined ? config.streamerName : 'AKMOVMEDIA';
      brandTitleEl.innerText = name.trim() ? `${name} • REACCIÓN` : 'REACCIÓN';
      camNameEl.innerText = name;
      const badge = camNameEl.closest('.cam-badge-tag');
      if (badge) {
        badge.style.display = name.trim() ? 'flex' : 'none';
      }
      window.overlayApp.renderSocialBar(socialBarEl);
    });
  </script>
</body>
</html>
