<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escena 2: Nos Vemos Pronto - Overlay Streaming</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Ambient & Particle Background -->
  <div class="scene-solid-bg"></div>
  <div class="tech-ambient-lines"></div>
  <div class="tech-radial-glow"></div>
  <canvas id="bg-canvas" class="overlay-canvas-bg"></canvas>

  <div class="scene-container">
    <!-- Cyber Outer Frame -->
    <div class="cyber-outer-frame">
      <div class="cyber-outer-border"></div>
      <div class="cyber-corner-accent corner-tl"></div>
      <div class="cyber-corner-accent corner-tr"></div>
      <div class="cyber-corner-accent corner-bl"></div>
      <div class="cyber-corner-accent corner-br"></div>
    </div>

    <!-- Center Hero Branding: Main Title "!NOS VEMOS PRONTO!" -->
    <div class="center-hero">
      <div id="status-ending-title" class="streamer-status-title">¡NOS VEMOS PRONTO!</div>
      <div id="ending-streamer-name" class="streamer-subtitle">GRACIAS POR ACOMPAÑARNOS HOY</div>
    </div>

    <!-- Barra de Chat Lineal Horizontal justo arriba de las redes sociales -->
    <div class="chat-linear-container" id="chat-linear-bar">
      <div class="chat-linear-badge">
        <span class="live-indicator-dot"></span>
        <span>CHAT</span>
      </div>
      <div class="chat-linear-track" id="linear-chat-track"></div>
    </div>

    <!-- Barra de Redes Sociales Biselada -->
    <div class="social-bar-container" id="social-bar"></div>
  </div>

  <script src="app.js"></script>
  <script>
    window.overlayApp.setupBackground('scene-nos-vemos-pronto.html');

    const titleEl = document.getElementById('status-ending-title');
    const subtitleEl = document.getElementById('ending-streamer-name');
    const socialBarEl = document.getElementById('social-bar');
    const linearChatTrack = document.getElementById('linear-chat-track');
    const linearChatBar = document.getElementById('chat-linear-bar');

    // Linear Chat message appender
    window.overlayApp.onChatMessage((user, text) => {
      if (!linearChatTrack) return;
      const msgEl = document.createElement('div');
      msgEl.className = 'chat-linear-msg';
      msgEl.innerHTML = `
        <span class="chat-linear-user">${user}:</span>
        <span class="chat-linear-text">${text}</span>
      `;
      linearChatTrack.appendChild(msgEl);

      // Keep only last 10 messages in linear stream
      while (linearChatTrack.children.length > 10) {
        linearChatTrack.removeChild(linearChatTrack.firstChild);
      }
      linearChatTrack.scrollLeft = linearChatTrack.scrollWidth;
    });

    function renderGlitchLetters(text) {
      titleEl.innerHTML = '';
      const chars = text.split('');
      chars.forEach((char, index) => {
        const span = document.createElement('span');
        if (char === ' ') {
          span.className = 'glitch-char space';
          span.innerHTML = '&nbsp;';
        } else {
          span.className = 'glitch-char';
          span.innerText = char;
        }
        span.style.animationDelay = `${index * 0.045}s, ${1.5 + Math.random() * 2}s`;
        titleEl.appendChild(span);
      });
    }

    let lastText = '';
    window.overlayApp.subscribe((config) => {
      const text = config.statusEnding !== undefined ? config.statusEnding : '¡NOS VEMOS PRONTO!';
      if (text !== lastText) {
        lastText = text;
        renderGlitchLetters(text);
      }
      const name = config.streamerName !== undefined ? config.streamerName : 'AKMOVMEDIA';
      subtitleEl.innerText = name.trim() ? `${name} • GRACIAS POR EL APOYO` : 'GRACIAS POR EL APOYO';
      window.overlayApp.renderSocialBar(socialBarEl);
    });
  </script>
</body>
</html>
