<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKMOV MEDIA — Widgets Overlay (Chat & Alertas)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Oswald:wght@500;700&family=JetBrains+Mono:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-black: #000000;
      --color-white: #ffffff;
      --color-neon: #00ff00;
      --color-neon-dim: rgba(0, 255, 0, 0.15);
      --color-neon-glow: rgba(0, 255, 0, 0.4);
      --color-gray-dark: rgba(18, 18, 18, 0.95);
      --color-gray-border: #2a2a2a;
      
      --font-display: 'Oswald', sans-serif;
      --font-sans: 'Montserrat', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-8bit: 'Press Start 2P', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: transparent; /* Transparent for overlaying in OBS */
      color: var(--color-white);
      font-family: var(--font-sans);
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      position: relative;
    }

    /* WIDGET 1: STANDALONE CHAT (Transparent background) */
    .widget-chat {
      position: absolute;
      top: 50px;
      left: 50px;
      width: 450px;
      height: 600px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      padding: 10px;
      z-index: 10;
    }

    .chat-messages {
      display: flex;
      flex-direction: column;
      gap: 15px;
      justify-content: flex-end;
    }

    .chat-message {
      background-color: rgba(0, 0, 0, 0.7);
      border-left: 4px solid var(--color-neon);
      padding: 10px 15px;
      box-shadow: 3px 3px 0 rgba(0,0,0,0.3);
      animation: message-fade 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      opacity: 0;
      transform: translateY(20px);
    }

    @keyframes message-fade {
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-user {
      font-family: var(--font-8bit);
      font-size: 0.65rem; /* 8-bit text looks better small */
      color: var(--color-neon);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .chat-text {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      line-height: 1.4;
      color: var(--color-white);
    }

    /* WIDGET 2: STANDALONE ALERTS (Top Center) */
    .widget-alerts {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 550px;
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      z-index: 10;
      overflow: visible;
    }

    .alert-card {
      width: 100%;
      background-color: var(--color-black);
      border: 3px solid var(--color-neon);
      box-shadow: 0 0 25px var(--color-neon-dim);
      padding: 20px 30px;
      display: flex;
      align-items: center;
      gap: 25px;
      position: relative;
      transform: translateY(-250px);
      opacity: 0;
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
    }

    .alert-card.active {
      transform: translateY(0);
      opacity: 1;
    }

    /* Brutalist Star anim */
    .alert-star {
      width: 50px;
      height: 50px;
      color: var(--color-neon);
      animation: rotate-star 4s infinite linear;
      filter: drop-shadow(0 0 8px var(--color-neon));
    }

    @keyframes rotate-star {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .alert-body {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .alert-title {
      font-family: var(--font-8bit);
      font-size: 0.75rem;
      color: var(--color-neon);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .alert-user {
      font-family: var(--font-display);
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--color-white);
      text-transform: uppercase;
      text-shadow: 2px 2px 0 var(--color-black), 3px 3px 0 var(--color-white);
      letter-spacing: 2px;
    }

    /* CONTROL PANEL (Only visible for local testing, hidden when ?obs=true) */
    .control-panel {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--color-gray-dark);
      border: 2px solid var(--color-gray-border);
      padding: 15px 30px;
      border-radius: 4px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .control-panel.hidden {
      display: none;
    }

    .control-title {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--color-neon);
      letter-spacing: 1px;
    }

    .control-buttons {
      display: flex;
      gap: 10px;
    }

    .control-btn {
      background-color: #222;
      border: 1px solid var(--color-neon);
      color: var(--color-white);
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 0.8rem;
      padding: 8px 16px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    .control-btn:hover {
      background-color: var(--color-neon);
      color: var(--color-black);
      box-shadow: 0 0 10px var(--color-neon-dim);
    }
  </style>
</head>
<body>

  <!-- CHAT WIDGET -->
  <div id="chat-widget" class="widget-chat">
    <div class="chat-messages" id="chat-messages">
      <!-- Chat logs -->
    </div>
  </div>

  <!-- ALERTS WIDGET -->
  <div id="alerts-widget" class="widget-alerts">
    <div class="alert-card" id="alert-card">
      <svg class="alert-star" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L15 9L22 12L15 15L12 22L9 15L2 12L9 9Z"/>
      </svg>
      <div class="alert-body">
        <div class="alert-title" id="alert-title">NUEVO SEGUIDOR</div>
        <div class="alert-user" id="alert-user">MATIAS_RETRO</div>
      </div>
    </div>
  </div>

  <!-- CONTROL PANEL FOR STREAMERS TO TEST -->
  <div class="control-panel" id="control-panel">
    <div class="control-title">AKMOV MEDIA WIDGET SIMULATOR (Añade ?obs=true para ocultar esto)</div>
    <div class="control-buttons">
      <button class="control-btn" onclick="simulateFollow()">Test Follow</button>
      <button class="control-btn" onclick="simulateSub()">Test Subscriber</button>
      <button class="control-btn" onclick="simulateChat()">Test Chat Message</button>
    </div>
  </div>

  <script>
    const chatMessages = document.getElementById('chat-messages');
    const alertCard = document.getElementById('alert-card');
    const alertTitle = document.getElementById('alert-title');
    const alertUser = document.getElementById('alert-user');
    const controlPanel = document.getElementById('control-panel');

    const userNames = ['Huasco_Boss', 'Mati_Vallenar', 'KokeOnline', 'AtacamaGamer', 'FranStar', 'RetroVibes', 'SignalMaster'];
    const messages = [
      '¡Buenas! Se ve brutal el stream 🎮',
      '¿Qué tal la señal en vivo?',
      'Saludos de toda la gente del valle 🏞️',
      'El neón queda perfecto con la estrella.',
      '¿Qué canal de Discord usan?',
      '¡Comentando en vivo!',
      'Mandame un saludo en directo!'
    ];

    // Read URL params
    const urlParams = new URLSearchParams(window.location.search);
    const type = urlParams.get('type'); // chat, alert, or all (default)
    const isObs = urlParams.get('obs') === 'true';

    // Hide simulator panel if ?obs=true is set
    if (isObs) {
      controlPanel.classList.add('hidden');
    }

    // Hide/show widgets based on type
    if (type === 'chat') {
      document.getElementById('alerts-widget').style.display = 'none';
      document.getElementById('chat-widget').style.top = '10px';
      document.getElementById('chat-widget').style.left = '10px';
      document.getElementById('chat-widget').style.width = '100%';
      document.getElementById('chat-widget').style.height = '100%';
    } else if (type === 'alert') {
      document.getElementById('chat-widget').style.display = 'none';
      document.getElementById('alerts-widget').style.top = '10px';
      document.getElementById('alerts-widget').style.width = '100%';
    }

    // ─── OWNCAST CHAT INTEGRATION ───
    const apiBase = urlParams.get('api') || 'https://api.akmovmedia.com';
    const streamUrl = urlParams.get('stream') || 'https://stream.akmovmedia.com';
    let isOwncastConnected = false;
    let autoSim = urlParams.get('test') === 'true'; // Run simulator only if ?test=true is passed

    function addChatMessage(user, text) {
      const messageEl = document.createElement('div');
      messageEl.className = 'chat-message';
      messageEl.innerHTML = `
        <div class="chat-user">${user}</div>
        <div class="chat-text">${text}</div>
      `;
      chatMessages.appendChild(messageEl);

      // Scroll limit
      while (chatMessages.children.length > 12) {
        chatMessages.removeChild(chatMessages.firstChild);
      }
    }

    async function connectOwncastChat() {
      try {
        const tokenRes = await fetch(`${apiBase}/owncast/chat-token`);
        if (!tokenRes.ok) throw new Error('Failed to get chat token from admin-api');
        const tokenData = await tokenRes.json();
        if (!tokenData.success) throw new Error(tokenData.error);
        
        const wsUrl = streamUrl.replace(/^http/, 'ws') + `/entry?accessToken=${tokenData.accessToken}`;
        const socket = new WebSocket(wsUrl);

        socket.onopen = () => {
          console.log('✅ Conectado al chat de Owncast:', wsUrl);
          isOwncastConnected = true;
          autoSim = false; // Disable simulator
        };

        socket.onmessage = (event) => {
          const data = JSON.parse(event.data);
          if (data.type === 'CHAT') {
            addChatMessage(data.user.displayName, data.body);
          }
        };

        socket.onclose = () => {
          console.warn('❌ Conexión de chat de Owncast cerrada. Reintentando...');
          isOwncastConnected = false;
          setTimeout(connectOwncastChat, 5000);
        };
      } catch (err) {
        console.warn('⚠ No se pudo conectar al chat de Owncast. Usando simulador:', err.message);
        isOwncastConnected = false;
      }
    }

    // ─── REAL-TIME ALERTS SSE CONNECTION ───
    function connectAlertsSSE() {
      try {
        const eventSource = new EventSource(`${apiBase}/alerts/stream`);
        
        eventSource.onmessage = (event) => {
          const alertData = JSON.parse(event.data);
          console.log('🔔 Evento recibido desde SSE:', alertData);
          if (alertData.dataType === 'CHAT') {
            addChatMessage(alertData.user, alertData.text);
          } else {
            triggerAlert(alertData.type, alertData.user);
          }
        };

        eventSource.onerror = (err) => {
          console.warn('⚠ Error en conexión SSE de alertas. Reintentando...');
          eventSource.close();
          setTimeout(connectAlertsSSE, 5000);
        };
      } catch (e) {
        console.warn('⚠ No se pudo conectar al servidor local de alertas (admin-api).');
      }
    }

    // Simulator triggers
    function simulateChat() {
      if (isOwncastConnected) return;
      const u = userNames[Math.floor(Math.random() * userNames.length)];
      const t = messages[Math.floor(Math.random() * messages.length)];
      addChatMessage(u, t);
    }

    let alertTimeout;
    function triggerAlert(title, user) {
      clearTimeout(alertTimeout);
      alertCard.classList.remove('active');
      
      // Delay slightly for re-activation animation
      setTimeout(() => {
        alertTitle.textContent = title;
        alertUser.textContent = user.toUpperCase();
        alertCard.classList.add('active');

        alertTimeout = setTimeout(() => {
          alertCard.classList.remove('active');
        }, 5000);
      }, 100);
    }

    function simulateFollow() {
      const u = userNames[Math.floor(Math.random() * userNames.length)];
      triggerAlert('NUEVO SEGUIDOR', u);
    }

    function simulateSub() {
      const u = userNames[Math.floor(Math.random() * userNames.length)];
      triggerAlert('NUEVO SUSCRIPTOR', u);
    }

    // Initialize Connections
    connectAlertsSSE();

    // Automatic background simulators for demoing
    setInterval(() => {
      if (autoSim) simulateChat();
    }, 5000);
    
    setInterval(() => {
      if (autoSim) simulateFollow();
    }, 15000);
    
    // Initial load simulator messages
    setTimeout(() => { if (autoSim) simulateChat(); }, 1000);
    setTimeout(() => { if (autoSim) simulateChat(); }, 2000);
  </script>
</body>
</html>
